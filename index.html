<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">

<title>Bâtiment 3D</title>
<!-- Bâtiment 3D v6 — 09/11/2026 — saisie comme la feuille de prise de cotes (en-tête, bâtiment sur schéma, faîtage et travées, couverture, pannes, rampants A–R, compléments). Avant : v5 — pannes en mm, câble total sur la descente. Avant : v4 — Dimensions (largeur, longueur, hauteurs), toit provisoire, onglet Coupe, Couverture (bac / panneau). Avant : v3 — version PC : étapes, Plan / 3D, dessin à la souris, auvent, bardage, portes, local technique et câble. Rien n'est enregistré. -->
<style>
:root{--g:#0f3d2e;--g2:#1d6b4f;--bg:#eef1ee;--card:#fff;--line:#d5ddd7;--txt:#1d2a24;--mut:#5b6b63;--red:#c62828;--warn:#9a5b00;--wbg:#fff4e0;--ok:#1b7a3d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);background:var(--bg);min-width:1200px;overflow:hidden}
header{height:52px;background:var(--g);color:#fff;padding:0 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
.btn{border:0;border-radius:8px;padding:8px 13px;font-weight:700;font-size:14px;cursor:pointer;background:#fff;color:var(--g);font-family:inherit}
.btn:hover{filter:brightness(.95)}
.btn.y{background:#f2c230;color:#222}
.btn.s{padding:5px 10px;font-size:13px;background:#e7efe9}
.btn.on{background:var(--g);color:#fff}
.btn.r{background:#fbe9e9;color:var(--red)}
#app{display:grid;grid-template-columns:480px 1fr;height:calc(100% - 52px)}
#side{overflow:auto;border-right:1px solid var(--line);padding:10px 12px 60px;background:#f6f8f6}
#work{position:relative;display:flex;flex-direction:column;min-width:0}
#wbar{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#fff;border-bottom:1px solid var(--line)}
#wbar .tabs{display:flex;gap:4px;background:#e7efe9;border-radius:9px;padding:3px}
#wbar .tabs button{border:0;background:transparent;border-radius:7px;padding:6px 16px;font-weight:700;font-size:14px;color:var(--g);cursor:pointer;font-family:inherit}
#wbar .tabs button.on{background:var(--g);color:#fff}
#wbar .sep{flex:1}
#wbar label{font-size:13px;font-weight:600;display:flex;gap:5px;align-items:center}
#stage{position:relative;flex:1;min-height:0}
#v3d,#plan,#coupe{position:absolute;inset:0;width:100%;height:100%}
#coupe{background:#fff;display:block}
.cvn{font-size:12px;color:var(--g2);width:64px}
.calc{font-size:13px;color:var(--g2);font-weight:600;margin:4px 0 2px}
#v3d canvas{display:block;width:100%;height:100%}
#plan{background:#fbfcfb;cursor:crosshair;display:block}
#banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--g);color:#fff;border-radius:10px;padding:8px 16px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none;white-space:nowrap;display:none}
#banner b{color:#f2c230}
#vmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:600;color:var(--red)}
#warnbar{max-height:110px;overflow:auto;background:#fff;border-top:1px solid var(--line);padding:6px 12px;font-size:13px}
#warnbar .w{color:var(--warn);font-weight:600;margin:2px 0}
#warnbar .okk{color:var(--ok);font-weight:600}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;overflow:hidden}
.step>h2{margin:0;font-size:15px;padding:11px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--g)}
.step>h2 .n{background:var(--g);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.step>h2 .sum{margin-left:auto;font-size:12px;color:var(--mut);font-weight:500}
.step.open>h2{border-bottom:1px solid #edf1ee}
.step .body{display:none;padding:8px 12px 12px}
.step.open .body{display:block}
.step h3{font-size:14px;margin:12px 0 6px;color:var(--g2)}
.seg{display:flex;gap:4px;background:#e7efe9;border-radius:10px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--g);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--g);color:#fff}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.row>span:first-child{flex:1;font-size:14px}
input.num,select{font:inherit;font-size:14px;padding:5px 7px;border:1px solid #b9c6be;border-radius:7px;background:#fff;color:var(--txt)}
input.num{width:84px;text-align:right}
.unit{color:var(--mut);font-size:13px;width:14px}
.bad{border-color:var(--red)!important;background:#fff2f2!important}
.hint{font-size:12.5px;color:var(--mut);margin:4px 0 6px;line-height:1.45}
.next{margin-top:10px;width:100%}
table.vt{width:100%;border-collapse:collapse;font-size:13px}
table.vt th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:3px 2px}
table.vt td{padding:2px;border-top:1px solid #f0f3f1}
table.vt td.cu{color:var(--mut);text-align:right;width:58px}
table.vt input.num{width:66px}
table.vt td:nth-child(2){white-space:nowrap}
table.vt tr.tot td{background:#f5f8f6}
.chk{font-size:13px;font-weight:700;margin:6px 0}
.chk.ok{color:var(--ok)}.chk.ko{color:var(--warn)}
.vbox{border:1px solid #e3e9e5;border-radius:10px;padding:8px 10px;margin:8px 0;background:#fcfdfc}
.vbox h3{margin-top:0}
.fac{border:1px solid #e3e9e5;border-radius:10px;padding:6px 9px;margin:6px 0;background:#fcfdfc}
.fac .ft{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--g2)}
.fac .ft span{flex:1}
.pc{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:13px}
.pc>span:first-child{width:118px}
.pc input.num{width:58px}
#info table{width:100%;border-collapse:collapse;font-size:13px}
#info td{padding:3px 2px;border-bottom:1px solid #edf1ee}
#info td:last-child{text-align:right;font-weight:600}
#lenEdit{position:absolute;display:none;z-index:5;width:90px;font-size:14px;padding:4px 6px;border:2px solid var(--g2);border-radius:6px;text-align:right}
.ptools{display:flex;gap:6px}
.hdr{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.hdr label{display:flex;flex-direction:column;font-size:12px;color:#1d4ed8;font-style:italic}.hdr label i{margin-bottom:2px}
input.tx{font:inherit;font-size:14px;padding:6px 8px;border:1px solid #e3cf9b;border-radius:6px;background:#fdf1d6;color:var(--txt);font-style:normal}input.tx.wide{width:100%}
.skw{position:relative;margin:6px 0 4px}.sk{width:100%;height:auto;display:block}
.fi{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;flex-wrap:wrap;justify-content:center;width:96px}
.fi i{width:100%;text-align:center;font-size:10.5px;color:#1d4ed8;line-height:1.1;text-shadow:0 0 3px #fff,0 0 3px #fff}.fi input.num{width:64px;background:#fdf1d6;border-color:#e3cf9b;padding:3px 5px;font-size:14px}.fi b{font-size:11px;color:#5b6b63;font-weight:600}
.ramt{display:flex;gap:12px;margin:6px 0}.ramt label{display:flex;flex-direction:column;font-size:12px;color:#1d4ed8;font-style:italic}.ramt input.num{background:#fdf1d6;border-color:#e3cf9b;width:96px;font-style:normal}.ramt b{display:none}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 10px}.pgrid label{display:flex;align-items:center;gap:6px}.pgrid b{width:14px;color:#1d2a24}.pgrid input.num{width:100%;background:#fdf1d6;border-color:#e3cf9b;padding:4px 6px}
</style>
</head>
<body>
<header>
  <h1>🏗️ Bâtiment 3D</h1>
  <button class="btn" id="bImg" type="button">🖼️ Enregistrer l'image</button>
  <button class="btn y" id="bPdf" type="button">📄 Exporter le PDF</button>
</header>
<div id="app">
  <div id="side"></div>
  <div id="work">
    <div id="wbar">
      <div class="tabs"><button type="button" data-tab="plan">🗺️ Plan</button><button type="button" data-tab="coupe">✂️ Coupe</button><button type="button" data-tab="3d">🧊 3D</button></div>
      <div class="ptools" id="ptools"></div>
      <span class="sep"></span>
      <label id="l1"><input type="checkbox" id="oCotes" checked> Cotes</label>
      <label id="l3"><input type="checkbox" id="oPente"> Cotes de pente</label>
      <label id="l2"><input type="checkbox" id="oTransp" checked> Toit transparent</label>
      <button class="btn s" id="bFit" type="button">⟲ Recentrer</button>
    </div>
    <div id="stage">
      <div id="v3d"></div>
      <canvas id="plan"></canvas>
      <canvas id="coupe"></canvas>
      <div id="banner"></div>
      <input id="lenEdit" inputmode="decimal">
      <div id="vmsg"></div>
    </div>
    <div id="warnbar"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';
// ================================================================ outils
const $=s=>document.querySelector(s);
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.').replace(/\s/g,''));return isFinite(x)?x:NaN;};
const f2=x=>isFinite(x)?(Math.round(x*100)/100).toFixed(2).replace('.',','):'—';
const f1=x=>isFinite(x)?(Math.round(x*10)/10).toFixed(1).replace('.',','):'—';
const H=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cum=a=>{let s=0;return a.map(v=>s+=(num(v)||0));};
const sum=a=>a.reduce((s,v)=>s+(num(v)||0),0);
const ORI=['nord','nord-est','est','sud-est','sud','sud-ouest','ouest','nord-ouest'];
const FAIT={vent:'Faîtage ventilé',boudin:'Faîtage boudin',plat:'Faîtage plat'};
const TYPES={mono:'Monopente',bi:'Bipente',irr:'Forme irrégulière'};
const KEYS={mono:['m'],bi:['A','B'],irr:['A','B']};
const rep=(v,n)=>Array.from({length:n},()=>v);

// ================================================================ données (rien n'est enregistré)
const VER=(pans,last,tDeb,tHaut)=>({deb:'0,30',pans,last,tDeb,tHaut,cass:'',auv:false,aw:'4'});
const LOC=on=>({on,side:0,piece:on?1:0,L:'2,50',P:'2,00',Hh:'2,50',gap:'0,80',ent:'0,60'});
const st={
  type:'bi',north:0,fait:'vent',tab:'3d',step:1,
  head:{date:new Date().toLocaleDateString('fr-FR'),affaire:'',client:'',interv:'',bat:'1'},
  ti:{mono:{qte:'5',larg:'6'},bi:{qte:'5',larg:'6'},irr:{qte:'4',larg:'4'}},
  sec:{h:'140',w:'70',type:'epaisse'},
  mono:{W:'10',L:'30',LC:'',h1:'5',h2:'7'},
  bi:{W:'12',L:'30',LC:'',hA:'6',hB:'6',hf:'8'},
  irr:{pts:[[0,0],[16,0],[16,6],[10,6],[10,11],[0,11]],ridge:[[0,3],[16,3]],h:'5',hf:'7',mode:'edit'},
  vers:{
    mono:{m:VER(['400'].concat(rep('1650',6)),'200','10,25','10,50')},
    bi:{A:VER(['400'].concat(rep('1500',4)),'220','6,37','6,62'),B:VER(['400'].concat(rep('1500',4)),'220','6,37','6,62')},
    irr:{A:VER(['400'].concat(rep('1600',5)),'150','8,30','8,55'),B:VER(['400','1600','1600'],'310','3,66','3,91')}},
  trav:{mono:rep('6',5),bi:rep('6',5),irr:rep('4',4)},
  fac:{mono:{},bi:{},irr:{}},
  loc:{mono:LOC(false),bi:LOC(true),irr:LOC(false)},
  couv:{type:'bac',bac:{g:'',h:'',i:'',j:'',k:''},pan:{a:'',b:'',c:'',d:'',e:'',f:''}}
};
const getK=k=>k.split('.').reduce((o,p)=>o[p],st);
const setK=(k,v)=>{const p=k.split('.'),l=p.pop();p.reduce((o,q)=>o[q],st)[l]=v;};

// ================================================================ orientation
function northVec(){const a=st.north*Math.PI/4;return [Math.sin(a),-Math.cos(a)];}
function oriName(d){const N=northVec(),E=[-N[1],N[0]];let b=Math.atan2(d[0]*E[0]+d[1]*E[1],d[0]*N[0]+d[1]*N[1])*180/Math.PI;if(b<0)b+=360;return ORI[Math.round(b/45)%8];}

// ================================================================ géométrie plane
function polyArea(P){let a=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];a+=p[0]*q[1]-q[0]*p[1];}return a/2;}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function clipHalf(P,f){const out=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],fa=f(a),fb=f(b);if(fa>=0)out.push(a);if((fa>=0)!==(fb>=0)){const k=fa/(fa-fb);out.push([a[0]+k*(b[0]-a[0]),a[1]+k*(b[1]-a[1])]);}}
  return out.filter((p,i)=>{const q=out[(i+1)%out.length];return Math.hypot(p[0]-q[0],p[1]-q[1])>1e-6;});}
function segs(P,f,g,v){const xs=[];for(let i=0;i<P.length;i++){const A=P[i],B=P[(i+1)%P.length],fa=f(A),fb=f(B);if((fa<=v&&fb>v)||(fb<=v&&fa>v)){const k=(v-fa)/(fb-fa);xs.push(g(A)+k*(g(B)-g(A)));}}xs.sort((a,b)=>a-b);const r=[];for(let i=0;i+1<xs.length;i+=2)if(xs[i+1]-xs[i]>1e-6)r.push([xs[i],xs[i+1]]);return r;}
function outward(P,i){const p=P[i],q=P[(i+1)%P.length],L=Math.hypot(q[0]-p[0],q[1]-p[1])||1;let n=[(q[1]-p[1])/L,-(q[0]-p[0])/L];const m=[(p[0]+q[0])/2,(p[1]+q[1])/2];if(inPoly(m[0]+n[0]*0.05,m[1]+n[1]*0.05,P))n=[-n[0],-n[1]];return n;}

// ================================================================ modèle (3D, plan, alertes, PDF)
// pannes saisies en millimètres ; une valeur sous 20 (ex. « 1,50 ») est comprise en mètres
const panM=v=>{const x=num(v);return !isFinite(x)?NaN:(x<20?x:x/1000);};const toMM=m=>isFinite(m)?String(Math.round(m*1000)):'—';
function vNums(v){const c=(()=>{let s=0;return v.pans.map(x=>s+=(panM(x)||0));})(),tH=num(v.tHaut),last=tH>0?tH-(c.length?c[c.length-1]:0):panM(v.last),tD=num(v.tDeb),deb=num(v.deb)||0;const sumR=(c.length?c[c.length-1]:0)+(isFinite(last)?last:0);return {deb,c,last,tH,tD,R:tH>0?tH:sumR,sumR,aw:v.auv?Math.max(0,num(v.aw)||0):0};}
function mkV(key,poly,O,e,d,run,hTop,hEave,n,ridge){const rise=hTop-hEave,Rw=Math.hypot(run,rise),cs=run/Rw,slope=rise/run;
  const dist=p=>(p[0]-O[0])*d[0]+(p[1]-O[1])*d[1],along=p=>(p[0]-O[0])*e[0]+(p[1]-O[1])*e[1];
  const pt=(ds,al)=>[O[0]+d[0]*ds+e[0]*al,O[1]+d[1]*ds+e[1]*al],y=ds=>hTop-slope*ds;const dh=n.deb*cs;
  const roof=poly.map(p=>dist(p)>=run-0.01?[p[0]+d[0]*dh,p[1]+d[1]*dh]:p);
  return {key,poly,roof,O,e,d,run,hTop,hEave,rise,Rw,cs,slope,dist,along,pt,y,dh,n,ridge,aw:n.aw,wallDist:run-n.aw,sd:s=>run+dh-s*cs,name:'Versant '+oriName(d)};}
function circles(W,hA,hB,rA,rB){const dz=W,dy=hB-hA,dd=Math.hypot(dz,dy);if(rA+rB<=dd)return {err:'short'};if(Math.abs(rA-rB)>=dd)return {err:'long'};
  const a=(rA*rA-rB*rB+dd*dd)/(2*dd),hh=Math.sqrt(Math.max(0,rA*rA-a*a));return {zr:a*dz/dd-hh*dy/dd,yr:hA+a*dy/dd+hh*dz/dd};}
const PROV=Math.tan(15*Math.PI/180);
function computeModel(){const t=st.type,W=[],M={type:t,warns:W,vs:[]};const trv=st.trav[t];M.T=cum(trv);M.Ltr=sum(trv);
  if(trv.some(x=>!(num(x)>0)))W.push('Une largeur de travée est vide ou à zéro.');
  const ns={};KEYS[t].forEach(k=>ns[k]=vNums(st.vers[t][k]));if(t==='irr')KEYS.irr.forEach(k=>ns[k].aw=0);
  const prov=msg=>{M.prov=true;W.unshift('Toit PROVISOIRE : '+msg);};
  // longueur de couverture plus grande que le long pan = débord aux pignons
  const gable=(o,L)=>{const lc=num(o.LC);if(!(lc>0))return;if(lc<L-0.01){W.push(`La longueur de couverture (${f2(lc)} m) est plus petite que le long pan (${f2(L)} m).`);return;}const dg=(lc-L)/2;M.dg=dg;if(dg<0.005)return;M.vs.forEach(v=>{v.roof=v.roof.map(p=>p[0]<=1e-6?[p[0]-dg,p[1]]:p[0]>=L-1e-6?[p[0]+dg,p[1]]:p);});};
  {const q=Math.round(num(st.ti[t].qte));if(q>0&&trv.length&&q!==trv.length)W.push(`Infos travée : Qté = ${q}, mais ${trv.length} largeur${trv.length>1?'s':''} donnée${trv.length>1?'s':''}.`);}
  const lenOf=o=>{const Ln=num(o.L);if(Ln>0){if(M.Ltr>0&&Math.abs(M.Ltr-Ln)>0.05)W.push(`Les travées font ${f2(M.Ltr)} m au total, mais la longueur notée est ${f2(Ln)} m.`);return Ln;}return M.Ltr>0?M.Ltr:1;};
  if(t==='mono'){const Wd=num(st.mono.W),h1=num(st.mono.h1),h2i=num(st.mono.h2),n=ns.m;if(!(Wd>0&&h1>0)){W.push('Remplis la largeur et la hauteur du mur bas.');return M;}
    const runT=Wd+n.aw;let slope;
    if(h2i>0){if(h2i<=h1){prov('le mur haut doit être plus haut que le mur bas.');slope=PROV;}else slope=(h2i-h1)/Wd;}
    else{const Rt=n.R-n.deb;if(Rt>runT)slope=Math.sqrt(Rt*Rt-runT*runT)/runT;else{prov(`avec ces cotes, le toit (${f2(Rt)} m sans le débord) est plus court que la largeur${n.aw?' + l’auvent':''} (${f2(runT)} m). Note la hauteur du mur haut, ou corrige « Axe faîtage ».`);slope=PROV;}}
    const L=lenOf(st.mono);M.P=[[0,0],[L,0],[L,Wd],[0,Wd]];Object.assign(M,{Wd,h1,h2:h1+slope*Wd,h2calc:!(h2i>0)});
    const hp=h1-slope*n.aw;if(n.aw&&hp<1)W.push('Les poteaux de l’auvent seraient très bas ('+f2(hp)+' m) : vérifie la largeur de l’auvent.');
    M.vs.push(mkV('m',[[0,-n.aw],[L,-n.aw],[L,Wd],[0,Wd]],[0,Wd],[1,0],[0,-1],runT,M.h2,hp,n,false));gable(st.mono,L);}
  else if(t==='bi'){const Wd=num(st.bi.W),hA=num(st.bi.hA),hB=num(st.bi.hB),hfi=num(st.bi.hf);if(!(Wd>0&&hA>0&&hB>0)){W.push('Remplis la largeur et les deux hauteurs de mur.');return M;}
    const A=ns.A,B=ns.B;let zr=NaN,yr=NaN;
    if(A.R-A.deb>0&&B.R-B.deb>0){let rA=A.R-A.deb-A.aw,rB=B.R-B.deb-B.aw,c=null;for(let k=0;k<40;k++){c=circles(Wd,hA,hB,rA,rB);if(c.err)break;rA=(A.R-A.deb)*c.zr/(c.zr+A.aw);rB=(B.R-B.deb)*(Wd-c.zr)/(Wd-c.zr+B.aw);}
      if(!c.err&&c.zr>0.05&&c.zr<Wd-0.05){zr=c.zr;yr=c.yr;}}
    if(hfi>0){if(!isFinite(zr))zr=Wd/2;if(hfi<=Math.max(hA,hB)+0.05){prov('la hauteur au faîtage doit être plus grande que celle des murs.');yr=Math.max(hA,hB)+PROV*Wd/2;zr=Wd/2;}else yr=hfi;}

  const hitVertex=m=>{const P=st.irr.pts;for(let i=0;i<P.length;i++){const s=W2S(P[i]);if(Math.hypot(s[0]-m[0],s[1]-m[1])<9)return i;}return -1;};
  const hitRidge=m=>{const R=st.irr.ridge;for(let i=0;i<R.length;i++){const s=W2S(R[i]);if(Math.hypot(s[0]-m[0],s[1]-m[1])<10)return i;}return -1;};
  const hitLabel=m=>labelHits.find(l=>Math.abs(l.x-m[0])<l.w/2&&Math.abs(l.y-m[1])<10);
  cv.addEventListener('mousemove',e=>{const m=pos(e);pv.mouse=m;if(down){if(Math.hypot(m[0]-down.start[0],m[1]-down.start[1])>4)down.moved=true;
      if(down.moved){if(down.kind==='v'){st.irr.pts[down.i]=snap(S2W(m[0],m[1]));model=computeModel();}else if(down.kind==='r'){st.irr.ridge[down.i]=ridgeTarget();model=computeModel();}else{pv.ox+=m[0]-down.m[0];pv.oy+=m[1]-down.m[1];}}down.m=m;drawPlan();return;}
    if(roseHit(m[0],m[1])>=0)cv.style.cursor='pointer';else if(st.type==='irr'&&st.irr.mode==='edit')cv.style.cursor=hitVertex(m)>=0||hitRidge(m)>=0?'move':hitLabel(m)?'text':'grab';else cv.style.cursor=st.type==='irr'?'crosshair':'grab';drawPlan();});
  cv.addEventListener('mouseleave',()=>{pv.mouse=null;if(!down)drawPlan();});
  cv.addEventListener('mousedown',e=>{if(e.button!==0)return;const m=pos(e);const rh=roseHit(m[0],m[1]);if(rh>=0){st.north=rh;renderSide();rebuild(false);drawPlan();return;}if(rh===-2)return;
    if(st.type==='irr'&&st.irr.mode==='edit'){const lh=hitLabel(m);if(lh){openLenEdit(lh);return;}
      const vi=hitVertex(m);if(vi>=0){pushUndo();down={kind:'v',i:vi,m,start:m};return;}const ri=hitRidge(m);if(ri>=0){pushUndo();down={kind:'r',i:ri,m,start:m};return;}}
    down={kind:'pan',m,start:m};});
  window.addEventListener('mouseup',e=>{if(!down)return;const d=down;down=null;if(d.kind==='pan'&&!d.moved){planClick();return;}if((d.kind==='v'||d.kind==='r')){if(d.moved)irrChanged();else pv.undo.pop();}});
  cv.addEventListener('dblclick',e=>{if(st.type!=='irr'||st.irr.mode!=='draw')return;const P=st.irr.pts;while(P.length>1&&Math.hypot(P[P.length-1][0]-P[P.length-2][0],P[P.length-1][1]-P[P.length-2][1])<1e-6)P.pop();if(P.length>=3)closeShape();});
  cv.addEventListener('contextmenu',e=>{e.preventDefault();if(st.type!=='irr')return;const m=pos(e),vi=hitVertex(m);if(vi>=0){if(st.irr.mode!=='draw'&&st.irr.pts.length<=3)return;pushUndo();st.irr.pts.splice(vi,1);irrChanged();}});
  cv.addEventListener('wheel',e=>{e.preventDefault();const m=pos(e),w=S2W(m[0],m[1]),k=e.deltaY<0?1.15:1/1.15;pv.s=Math.max(3,Math.min(150,pv.s*k));pv.ox=m[0]-w[0]*pv.s;pv.oy=m[1]-w[1]*pv.s;drawPlan();},{passive:false});
  document.addEventListener('keydown',e=>{if(st.tab!=='plan'||st.type!=='irr')return;const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT'))return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
    if(st.irr.mode!=='draw')return;if(/^[0-9]$/.test(e.key)||((e.key===','||e.key==='.')&&!/[,.]/.test(pv.buf))){pv.buf+=e.key==='.'?',':e.key;drawPlan();e.preventDefault();}
    else if(e.key==='Backspace'){pv.buf=pv.buf.slice(0,-1);drawPlan();e.preventDefault();}else if(e.key==='Escape'){pv.buf='';drawPlan();}
    else if(e.key==='Enter'&&pv.buf&&st.irr.pts.length){const t=drawTarget();pushUndo();st.irr.pts.push(t);pv.buf='';irrChanged();}});}
function closeShape(){st.irr.mode='ridge';st.irr.ridge=[];pv.buf='';irrChanged();fitPlan();}
function planClick(){if(st.type!=='irr')return;const md=st.irr.mode,P=st.irr.pts;
  if(md==='draw'){const t=drawTarget();if(P.length>=3&&t[0]===P[0][0]&&t[1]===P[0][1]){pushUndo();closeShape();return;}if(P.length&&Math.hypot(t[0]-P[P.length-1][0],t[1]-P[P.length-1][1])<1e-6)return;pushUndo();P.push(t);pv.buf='';irrChanged();}
  else if(md==='ridge'){const t=ridgeTarget();if(st.irr.ridge.length===1&&Math.hypot(t[0]-st.irr.ridge[0][0],t[1]-st.irr.ridge[0][1])<0.1)return;pushUndo();st.irr.ridge.push(t);if(st.irr.ridge.length>=2)st.irr.mode='edit';irrChanged();}}
function undo(){const s=pv.undo.pop();if(!s)return;st.irr=JSON.parse(s);irrChanged();}
function setSideLen(i,L){const P=st.irr.pts;if(!(L>0)||i>=P.length-1)return;const p=P[i],q=P[i+1];const l=Math.hypot(q[0]-p[0],q[1]-p[1])||1,dx=(q[0]-p[0])/l*(L-l),dy=(q[1]-p[1])/l*(L-l);pushUndo();
  const ux=(q[0]-p[0])/l,uy=(q[1]-p[1])/l;for(let k=0;k<P.length;k++){if(k===i)continue;if((P[k][0]-q[0])*ux+(P[k][1]-q[1])*uy>=-1e-6)P[k]=[P[k][0]+dx,P[k][1]+dy];}// le bâtiment s'étire : les coins situés au-delà du bout du côté avancent avec lui
  irrChanged();}
function openLenEdit(lh){const el=$('#lenEdit'),P=st.irr.pts,p=P[lh.i],q=P[(lh.i+1)%P.length];el.style.left=(lh.x-45)+'px';el.style.top=(lh.y-14)+'px';el.style.display='block';el.value=f2(Math.hypot(q[0]-p[0],q[1]-p[1]));el.dataset.i=lh.i;setTimeout(()=>{el.focus();el.select();},0);}
$('#lenEdit').addEventListener('keydown',e=>{if(e.key==='Enter'){const el=e.target;el.style.display='none';setSideLen(+el.dataset.i,num(el.value));}else if(e.key==='Escape')e.target.style.display='none';});
$('#lenEdit').addEventListener('blur',e=>{e.target.style.display='none';});

function resize(){if(!renderer)return;const v=$('#v3d'),w=v.clientWidth,h=v.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);renderer.domElement.style.width=w+'px';renderer.domElement.style.height=h+'px';camera.aspect=w/h;camera.updateProjectionMatrix();}
function disposeGrp(){if(!grp)return;scene.remove(grp);grp.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const m=o.material;if(m.map)m.map.dispose();m.dispose();}});grp=null;}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function mats(){const tr=$('#oTransp').checked;return {
  roof:new THREE.MeshLambertMaterial({color:0x8fb0c8,transparent:true,opacity:tr?0.32:0.92,side:THREE.DoubleSide,depthWrite:!tr}),
  wall:new THREE.MeshLambertMaterial({color:0xe6dfd2,transparent:true,opacity:tr?0.5:0.96,side:THREE.DoubleSide,depthWrite:!tr}),
  door:new THREE.MeshLambertMaterial({color:0x6f8190,side:THREE.DoubleSide}),loc:new THREE.MeshLambertMaterial({color:0xe9d7ae}),
  pan:new THREE.MeshLambertMaterial({color:({bois:0xa86b3c,mince:0x8fb3d1,epaisse:0x3f5f7a})[st.sec.type]||0xe8862a}),fr:new THREE.MeshLambertMaterial({color:0x2c4a8a}),cab:new THREE.MeshLambertMaterial({color:0xc62828}),
  cap:new THREE.MeshLambertMaterial({color:0x56626a,side:THREE.DoubleSide}),edge:new THREE.LineBasicMaterial({color:0x33413a})};}
function tris(pts,idx,mat){const g=new THREE.BufferGeometry();const a=[];idx.forEach(i=>{const p=pts[i];a.push(p.x,p.y,p.z);});g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));g.computeVertexNormals();const m=new THREE.Mesh(g,mat);grp.add(m);return m;}
function poly3(pts,mat){const n=new THREE.Vector3();for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];n.x+=(a.y-b.y)*(a.z+b.z);n.y+=(a.z-b.z)*(a.x+b.x);n.z+=(a.x-b.x)*(a.y+b.y);}
  const ax=Math.abs(n.x),ay=Math.abs(n.y),az=Math.abs(n.z);const pr=ay>=ax&&ay>=az?p=>new THREE.Vector2(p.x,p.z):ax>=az?p=>new THREE.Vector2(p.y,p.z):p=>new THREE.Vector2(p.x,p.y);
  const f=THREE.ShapeUtils.triangulateShape(pts.map(pr),[]);const idx=[];f.forEach(t=>idx.push(t[0],t[1],t[2]));return tris(pts,idx,mat);}
function lines(arr,mat){const g=new THREE.BufferGeometry();const a=[];arr.forEach(p=>a.push(p.x,p.y,p.z));g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));const l=new THREE.LineSegments(g,mat);grp.add(l);return l;}
function loop3(pts,mat){const a=[];pts.forEach((p,i)=>a.push(p,pts[(i+1)%pts.length]));return lines(a,mat);}
function beam(p1,p2,w,h,mat){const d=p2.clone().sub(p1),L=d.length();if(L<1e-4)return;const m=new THREE.Mesh(new THREE.BoxGeometry(L,h,w),mat);m.position.copy(p1).add(p2).multiplyScalar(0.5);
  const dir=d.normalize();m.quaternion.setFromUnitVectors(V(1,0,0),dir);if(Math.abs(dir.y)<0.99){const side=new THREE.Vector3().crossVectors(dir,V(0,1,0)).normalize();const yy=new THREE.Vector3().crossVectors(side,dir).normalize();m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(dir,yy,side));}grp.add(m);}
function cyl(p1,p2,r,mat){const d=p2.clone().sub(p1),L=d.length();if(L<1e-4)return;const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,18),mat);m.position.copy(p1).add(p2).multiplyScalar(0.5);m.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());grp.add(m);}
function rr(k,x,y,w,h,r){k.beginPath();k.moveTo(x+r,y);k.arcTo(x+w,y,x+w,y+h,r);k.arcTo(x+w,y+h,x,y+h,r);k.arcTo(x,y+h,x,y,r);k.arcTo(x,y,x+w,y,r);k.closePath();}
function label(txt,p,col,big,force){if(!force&&!$('#oCotes').checked)return;const c=document.createElement('canvas'),k=c.getContext('2d');const fs=44;k.font='bold '+fs+'px Arial';const w=Math.ceil(k.measureText(txt).width)+26,h=fs+18;c.width=w;c.height=h;
  k.font='bold '+fs+'px Arial';k.fillStyle='rgba(255,255,255,.93)';rr(k,2,2,w-4,h-4,12);k.fill();k.strokeStyle=col||'#1d6b4f';k.lineWidth=4;k.stroke();k.fillStyle=col||'#1d6b4f';k.textAlign='center';k.textBaseline='middle';k.fillText(txt,w/2,h/2+2);
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));s.renderOrder=10;const sc=LS*(big||1);s.scale.set(sc*w/h,sc,1);s.position.copy(p);grp.add(s);}
function dim(p1,p2,txt,col,force){if(!force&&!$('#oCotes').checked)return;const m=new THREE.LineBasicMaterial({color:col||0x1d6b4f});const d=p2.clone().sub(p1);if(d.length()<1e-4)return;
  const t=LS*0.3;let perp=new THREE.Vector3().crossVectors(d,V(0,1,0));if(perp.length()<1e-6)perp=V(1,0,0);perp.normalize().multiplyScalar(t);
  lines([p1,p2,p1.clone().add(perp),p1.clone().sub(perp),p2.clone().add(perp),p2.clone().sub(perp)],m);label(txt,p1.clone().add(p2).multiplyScalar(0.5),col,1,force);}
function dashed(a,b,col){const g=new THREE.BufferGeometry().setFromPoints([a,b]);const l=new THREE.Line(g,new THREE.LineDashedMaterial({color:col,dashSize:0.35,gapSize:0.2}));l.computeLineDistances();grp.add(l);}

let fitNext=true;
function rebuild(fit){model=computeModel();updateInfo();if(fit)fitNext=true;if(st.tab==='plan')drawPlan();if(st.tab==='coupe')drawCoupe();if(!ok3d)return;disposeGrp();grp=new THREE.Group();scene.add(grp);const M=model;
  if(M.ok){const mm=mats();const size=Math.max(M.L||10,...M.vs.map(v=>v.run*2),M.yr||M.h2||5);LS=Math.max(0.3,Math.min(1.5,size*0.026));build(M,mm);
    const box=new THREE.Box3().setFromObject(grp),sz=box.getSize(V(0,0,0)),ce=box.getCenter(V(0,0,0));
    const gs=Math.ceil(Math.max(sz.x,sz.z)*1.5/5)*5||20;const grid=new THREE.GridHelper(gs,Math.max(4,Math.round(gs)),0xb8c4bd,0xd6ddd9);grid.position.set(ce.x,0,ce.z);grp.add(grid);
    if(fitNext){fitView(box);fitNext=false;}}}
function fitView(box){box=box||new THREE.Box3().setFromObject(grp);const sz=box.getSize(V(0,0,0)),ce=box.getCenter(V(0,0,0));const r=Math.max(sz.x,sz.y,sz.z)*0.5+0.5;
  const dist=r/Math.sin(camera.fov*Math.PI/360)*Math.max(1,1.15/Math.max(camera.aspect,0.6));const dir=V(-0.85,0.7,-1.1).normalize();
  controls.target.copy(ce);camera.position.copy(ce).add(dir.multiplyScalar(dist*0.8));camera.near=Math.max(0.05,dist/200);camera.far=dist*20;camera.updateProjectionMatrix();controls.update();}

function build(M,mm){const off=LS*1.5,ph=Math.min(0.6,Math.max(0.05,(num(st.sec.h)||200)/1000)),pw=Math.min(0.4,Math.max(0.03,(num(st.sec.w)||120)/1000))*(st.sec.type==='mince'?0.6:1),B=(p,y)=>V(p[0],y,p[1]);
  M.vs.forEach(v=>{const roof3=v.roof.map(p=>B(p,v.y(v.dist(p))));poly3(roof3,mm.roof);loop3(roof3,mm.edge);});
  if(M.prov){const v=M.vs[0];let al=0;v.poly.forEach(p=>al+=v.along(p));al/=v.poly.length;label('TOIT PROVISOIRE',B(v.pt(v.wallDist*0.5,al),v.hTop+LS*2.2),'#c62828',1.6,true);}
  {const sp=couvSpacing();if(sp>=0.15)M.vs.forEach(v=>{let a0=Infinity,a1=-Infinity;v.roof.forEach(p=>{a0=Math.min(a0,v.along(p));a1=Math.max(a1,v.along(p));});if((a1-a0)/sp>900)return;const arr=[];for(let a=a0+sp/2;a<a1;a+=sp)segs(v.roof,v.along,v.dist,a).forEach(([d0,d1])=>{arr.push(B(v.pt(d0,a),v.y(d0)+0.03),B(v.pt(d1,a),v.y(d1)+0.03));});if(arr.length)lines(arr,new THREE.LineBasicMaterial({color:0x4f6f87,transparent:true,opacity:0.5}));});}
  // ---- murs par façade et par travée (bardé / ouvert / porte)
  const PP=(S,t)=>[S.p[0]+(S.q[0]-S.p[0])*t,S.p[1]+(S.q[1]-S.p[1])*t];
  M.sides.forEach(S=>{let tr=null;if(M.vs.length>1){const f=M.vs[0].dist,fp=f(S.p),fq=f(S.q);if(fp*fq<0)tr=fp/(fp-fq);}
    const tops=(ta,tb)=>{const ts=[ta];if(tr!=null&&tr>ta+1e-6&&tr<tb-1e-6)ts.push(tr);ts.push(tb);return ts.map(t=>{const p=PP(S,t);return B(p,roofH(M,p));});};
    const wall=(ta,tb,yb)=>{if(tb-ta<1e-6)return;const top=tops(ta,tb);if(top.some(p=>p.y<=yb+0.01))return;const a=PP(S,ta),b=PP(S,tb);poly3([B(a,yb),B(b,yb)].concat(top.reverse()),mm.wall);};
    const all=tops(0,1);for(let i=0;i+1<all.length;i++)lines([all[i],all[i+1]],mm.edge);lines([B(S.p,0),B(S.p,roofH(M,S.p))],mm.edge);
    S.pieces.forEach(pc=>{const s=pc.s.s;if(s==='o'){lines([B(PP(S,pc.ta),0),B(PP(S,pc.tb),0)],new THREE.LineBasicMaterial({color:0x9aa8a0}));return;}
      if(s==='b'){wall(pc.ta,pc.tb,0);return;}
      const l=Math.max(0.3,Math.min(num(pc.s.l)||0,pc.len-0.2)),mid=(pc.ta+pc.tb)/2,d=l/S.L/2,d0=mid-d,d1=mid+d;const mn=Math.min(...tops(d0,d1).map(p=>p.y));const hd=Math.max(0.5,Math.min(num(pc.s.h)||0,mn-0.15));
      wall(pc.ta,d0,0);wall(d1,pc.tb,0);wall(d0,d1,hd);const a=PP(S,d0),b=PP(S,d1),o=[S.n[0]*0.03,S.n[1]*0.03];const A=V(a[0]+o[0],0,a[1]+o[1]),Bq=V(b[0]+o[0],0,b[1]+o[1]);
      tris([A,Bq,Bq.clone().setY(hd),A.clone().setY(hd)],[0,1,2,0,2,3],mm.door);loop3([A,Bq,Bq.clone().setY(hd),A.clone().setY(hd)],mm.edge);
      for(let k=1;k<5;k++){const y=hd*k/5;lines([A.clone().setY(y),Bq.clone().setY(y)],new THREE.LineBasicMaterial({color:0x4d5a64}));}
      label('Porte '+f2(l)+' × '+f2(hd),V((a[0]+b[0])/2+S.n[0]*0.5,hd+LS*0.6,(a[1]+b[1])/2+S.n[1]*0.5),'#3d474e',0.85);});});
  loop3(M.P.map(p=>B(p,0)),mm.edge);
  // ---- pannes (+ cassure)
  M.vs.forEach(v=>{const cass=Number(st.vers[M.type][v.key].cass)||0;v.n.c.forEach((s,i)=>{const ds=v.sd(s);if(ds<-1e-6)return;const yv=v.y(ds)-ph/2-0.03;
    segs(v.roof,v.dist,v.along,Math.max(ds,1e-3)).forEach(([a0,a1],si)=>{const p=v.pt(ds,a0),q=v.pt(ds,a1);beam(B(p,yv),B(q,yv),pw,ph,mm.pan);
      if(si===0&&$('#oPente').checked)label('P'+(i+1),B(v.pt(ds,a1+off*0.5),yv+ph),'#b55d0c',0.8);
      if(cass===i+1){dashed(B(p,v.y(ds)+0.06),B(q,v.y(ds)+0.06),0xc62828);label('cassure',B(v.pt(ds,(a0+a1)/2),v.y(ds)+LS*0.7),'#c62828',0.9,true);}});});});
  // ---- faîtage
  const v0=M.vs[0],rid=v0.ridge?segs(M.P,v0.dist,v0.along,0):segs(M.P,v0.dist,v0.along,0.001);
  rid.forEach(([a0,a1])=>{const top0=B(v0.pt(0,a0),v0.hTop),top1=B(v0.pt(0,a1),v0.hTop);
    M.vs.forEach(v=>{const s0=v.n.tD>0?Math.min(v.n.tD,v.n.R):v.n.R*0.96,ds=Math.max(0.02,v.sd(s0));const lift=st.fait==='vent'?0.12:0.05;
      const p0=B(v.pt(ds,a0),v.y(ds)+lift),p1=B(v.pt(ds,a1),v.y(ds)+lift),q0=top0.clone().setY(v.hTop+lift),q1=top1.clone().setY(v.hTop+lift);tris([p0,p1,q1,q0],[0,1,2,0,2,3],mm.cap);
      if(!v.ridge){const f0=q0.clone().setY(v.hTop-0.3),f1=q1.clone().setY(v.hTop-0.3);tris([q0,q1,f1,f0],[0,1,2,0,2,3],mm.cap);}});
    if(st.fait==='boudin'){const r=Math.max(0.12,Math.min(0.3,LS*0.25));cyl(top0.clone().setY(v0.hTop+r*0.5),top1.clone().setY(v0.hTop+r*0.5),r,mm.cap);}
    else if(st.fait==='vent'){beam(top0.clone().setY(v0.hTop+0.34),top1.clone().setY(v0.hTop+0.34),0.5,0.07,mm.cap);}

let tm=0;const later=()=>{clearTimeout(tm);tm=setTimeout(()=>rebuild(false),160);};
document.addEventListener('input',e=>{const el=e.target;if(el.id==='lenEdit')return;
  if(el.dataset.ti){st.ti[st.type][el.dataset.ti]=el.value;applyTI();updateInfo();later();return;}
  if(el.dataset.pan){const v=getK(el.dataset.pan),a=v.pans.slice();while(a.length<18)a.push('');a[+el.dataset.i]=el.value.trim();while(a.length&&a[a.length-1]==='')a.pop();v.pans=a;if(Number(v.cass)>a.length)v.cass='';updateInfo();later();return;}

  else if(el.dataset.l){getK(el.dataset.l)[+el.dataset.i]=el.value;el.classList.toggle('bad',!isFinite(num(el.value)));later();}
  else if(el.dataset.fl!=null){facGet(+el.dataset.fl,+el.dataset.p).l=el.value;later();}else if(el.dataset.fh!=null){facGet(+el.dataset.fh,+el.dataset.p).h=el.value;later();}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.ti||el.dataset.pan){renderSide();rebuild(!!el.dataset.ti);return;}
  if(el.dataset.ram){const i=KEYS[st.type].indexOf(el.dataset.ram),M0=model;if(M0&&M0.vs[i]){for(let k=0;k<8;k++){st.north=k;if(oriName(M0.vs[i].d)===el.value)break;}}renderSide();rebuild(false);return;}
  if(el.dataset.kb){setK(el.dataset.kb,el.checked);renderSide();rebuild(true);}
  else if(el.dataset.fs!=null){facGet(+el.dataset.fs,+el.dataset.p).s=el.value;renderSide();rebuild(false);}
  else if(el.dataset.side!=null){setSideLen(+el.dataset.side,num(el.value));}
  else if(el.dataset.l&&el.dataset.l.startsWith('trav')){renderSide();rebuild(true);}
  else if(el.dataset.k&&el.tagName!=='SELECT'&&/^(mono|bi|irr)\./.test(el.dataset.k)){renderSide();rebuild(true);if(st.tab==='plan')fitPlan();}

document.addEventListener('click',e=>{const b=e.target.closest('button,h2[data-open]');if(!b)return;const d=b.dataset;
  if(d.tab){setTab(d.tab);return;}
  if(d.open){st.step=+d.open;renderSide();if(st.step===2&&st.type==='irr')setTab('plan');return;}
  if(d.t){st.type=d.t;pv.fitted=false;renderSide();rebuild(true);if(st.type==='irr')setTab('plan');else if(st.tab==='plan')fitPlan();return;}
  if(d.f){st.fait=d.f;renderSide();rebuild(false);return;}
  if(d.cv){st.couv.type=d.cv;renderSide();rebuild(false);return;}
  if(d.sec){st.sec.type=d.sec;renderSide();rebuild(false);return;}
  if(d.padd){const v=getK(d.padd);v.pans.push(v.pans.length?v.pans[v.pans.length-1]:'1,50');renderSide();rebuild(false);return;}
  if(d.pdel){const v=getK(d.pdel);if(v.pans.length)v.pans.pop();if(Number(v.cass)>v.pans.length)v.cass='';renderSide();rebuild(false);return;}

  if(d.all){const v=document.querySelector(`[data-allv="${d.all}"]`).value;if(!isFinite(num(v)))return;const a=getK(d.all);for(let i=d.all.endsWith('.pans')?1:0;i<a.length;i++)a[i]=v;renderSide();rebuild(d.all.startsWith('trav'));return;}

  if(b.id==='pUndo'){undo();return;}
  if(b.id==='bImg')saveImg();else if(b.id==='bPdf')savePdf();});
window.addEventListener('resize',()=>{if(st.tab==='plan')drawPlan();if(st.tab==='coupe')drawCoupe();const pf=$('#prof');if(pf)drawProfile(pf);});

renderSide();init3d();setupPlan();setTab(st.tab);rebuild(true);
</script>
