<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Bâtiment 3D</title>
<!-- Bâtiment 3D — 05/11/2026 — outil personnel, rien n'est enregistré -->
<style>
:root{--g:#0f3d2e;--g2:#1d6b4f;--bg:#eef1ee;--card:#fff;--line:#d5ddd7;--txt:#1d2a24;--mut:#5b6b63;--red:#c62828;--warn:#9a5b00;--wbg:#fff4e0}
*{box-sizing:border-box}
html,body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);background:var(--bg)}
header{background:var(--g);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative;z-index:3}
header h1{font-size:17px;margin:0;flex:1;min-width:120px}
.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:700;font-size:14px;cursor:pointer;background:#fff;color:var(--g);font-family:inherit}
.btn.y{background:#f2c230;color:#222}
.btn.s{padding:6px 10px;font-size:13px;background:#e7efe9}
.btn:disabled{opacity:.5}
main{display:flex;height:calc(100vh - 52px)}
#view{position:relative;flex:1;min-width:0;background:linear-gradient(#dfe8ee,#f3f5f2)}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#vtools{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap}
#vtools label{background:rgba(255,255,255,.92);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:600;display:flex;gap:5px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#vwarn{position:absolute;right:8px;top:8px;max-width:60%;background:var(--wbg);color:var(--warn);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600;display:none;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#vmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:600;color:var(--red)}
#form{width:410px;overflow:auto;padding:10px 12px 40px;border-right:1px solid var(--line)}
@media(max-width:520px){header h1{font-size:16px}.btn{padding:8px 10px}.btn .tx{display:none}}
@media(max-width:820px){main{flex-direction:column;height:auto}#view{position:sticky;top:0;height:46vh;flex:none;z-index:2;border-bottom:1px solid var(--line)}#form{width:auto;border:0;overflow:visible}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--g)}
.card h3{font-size:13px;margin:10px 0 6px;color:var(--g2)}
.seg{display:flex;gap:4px;background:#e7efe9;border-radius:10px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--g);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--g);color:#fff}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.row>span:first-child{flex:1;font-size:14px}
.row small{color:var(--mut)}
input.num,select,input.cnt{font:inherit;font-size:16px;padding:6px 8px;border:1px solid #b9c6be;border-radius:8px;background:#fff;color:var(--txt)}
input.num{width:92px;text-align:right}
input.cnt{width:70px;text-align:center}
select{padding:6px 4px}
.unit{color:var(--mut);font-size:13px;width:14px}
.bad{border-color:var(--red)!important;background:#fff2f2!important}
.hint{font-size:12px;color:var(--mut);margin:4px 0}
.all{display:flex;gap:6px;align-items:center;margin:6px 0 2px;font-size:13px;color:var(--mut)}
.all input{width:80px}
.side{display:flex;gap:6px;align-items:center;margin:5px 0}
.side b{width:22px;font-size:13px;color:var(--g2)}
.side input.num{width:84px}
.side input.ang{width:64px}
.x{border:0;background:#f3e3e3;color:var(--red);border-radius:7px;width:30px;height:30px;font-weight:700;cursor:pointer}
#plan{width:100%;height:220px;border:1px solid var(--line);border-radius:10px;background:#fafcfa;touch-action:manipulation;margin-top:6px}
.warn{background:var(--wbg);color:var(--warn);border-radius:8px;padding:6px 8px;font-size:13px;margin:4px 0;font-weight:600}
#info table{width:100%;border-collapse:collapse;font-size:13px}
#info td{padding:3px 2px;border-bottom:1px solid #edf1ee}
#info td:last-child{text-align:right;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>🏗️ Bâtiment 3D</h1>
  <button class="btn s" id="bFit" type="button" title="Recentrer la vue">⟲<span class="tx"> Recentrer</span></button>
  <button class="btn" id="bImg" type="button">🖼️ Image</button>
  <button class="btn y" id="bPdf" type="button">📄 PDF</button>
</header>
<main>
  <div id="view">
    <div id="vtools">
      <label><input type="checkbox" id="oCotes" checked> Cotes</label>
      <label><input type="checkbox" id="oTransp" checked> Toit transparent</label>
    </div>
    <div id="vwarn"></div>
    <div id="vmsg"></div>
  </div>
  <div id="form"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';
// ---------------------------------------------------------------- outils
const $=s=>document.querySelector(s);
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.').replace(/\s/g,''));return isFinite(x)?x:NaN;};
const f2=x=>isFinite(x)?(Math.round(x*100)/100).toFixed(2).replace('.',','):'—';
const f1=x=>isFinite(x)?(Math.round(x*10)/10).toFixed(1).replace('.',','):'—';
const H=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DIRS=[['0','→'],['45','↘'],['90','↓'],['135','↙'],['180','←'],['225','↖'],['270','↑'],['315','↗'],['a','angle…']];
const DIRW={'0':'droite','45':'bas-droite','90':'bas','135':'bas-gauche','180':'gauche','225':'haut-gauche','270':'haut','315':'haut-droite'};

// ---------------------------------------------------------------- données (rien n'est enregistré)
const st={
  type:'bi',
  mono:{W:'10',h1:'5',h2:'7'},
  bi:{W:'12',h:'6',hf:'8'},
  irr:{sides:[{l:'20',d:'0',a:''},{l:'6',d:'90',a:''},{l:'8',d:'180',a:''},{l:'6',d:'90',a:''},{l:'12',d:'180',a:''}],low:0,hb:'5',p:'15',pu:'%'},
  pans:{mono:['0,30','1,80','1,80','1,80','1,80','1,80'],biG:['0,30','1,50','1,50','1,50'],biD:['0,30','1,50','1,50','1,50'],irr:['0,30','1,80','1,80','1,80']},
  trav:['6','6','6','6','6']
};
const getK=k=>k.split('.').reduce((o,p)=>o[p],st);
const setK=(k,v)=>{const p=k.split('.'),l=p.pop();p.reduce((o,q)=>o[q],st)[l]=v;};
const cum=a=>{let s=0;return a.map(v=>s+=(num(v)||0));};
const sum=a=>a.reduce((s,v)=>s+(num(v)||0),0);

// ---------------------------------------------------------------- formulaire
function fld(label,k,unit){const v=getK(k);return `<div class="row"><span>${label}</span><input class="num${isFinite(num(v))?'':' bad'}" inputmode="decimal" data-k="${k}" value="${H(v)}"><span class="unit">${unit||'m'}</span></div>`;}
function list(title,k,lab,hint){const a=getK(k);let h=`<h3>${title}</h3><div class="row"><span>Nombre</span><input class="cnt" inputmode="numeric" data-cnt="${k}" value="${a.length}"></div>`;
  if(hint)h+=`<p class="hint">${hint}</p>`;
  a.forEach((v,i)=>{h+=`<div class="row"><span>${lab(i)}</span><input class="num${isFinite(num(v))?'':' bad'}" inputmode="decimal" data-l="${k}" data-i="${i}" value="${H(v)}"><span class="unit">m</span></div>`;});
  if(a.length>1)h+=`<div class="all">Même valeur partout : <input class="num" inputmode="decimal" data-allv="${k}"><button class="btn s" type="button" data-all="${k}">Appliquer</button></div>`;
  return h;}
const panLab=i=>i===0?'Bord bas → P1':`P${i} → P${i+1}`;
function renderForm(){
  const t=st.type;let h=`<section class="card"><h2>1. Type de bâtiment</h2><div class="seg">
   <button type="button" data-t="mono" class="${t==='mono'?'on':''}">Monopente</button>
   <button type="button" data-t="bi" class="${t==='bi'?'on':''}">Bipente</button>
   <button type="button" data-t="irr" class="${t==='irr'?'on':''}">Forme irrégulière</button></div></section>`;
  h+=`<section class="card"><h2>2. Dimensions</h2>`;
  if(t==='mono')h+=fld('Largeur (portée)','mono.W')+fld('Hauteur mur bas','mono.h1')+fld('Hauteur mur haut','mono.h2')+`<p class="hint">La longueur = la somme des travées.</p>`;
  else if(t==='bi')h+=fld('Largeur (portée)','bi.W')+fld('Hauteur des murs','bi.h')+fld('Hauteur au faîtage','bi.hf')+`<p class="hint">Faîtage au milieu. La longueur = la somme des travées.</p>`;
  else{
    h+=`<p class="hint">Contour vu de dessus : chaque côté = une longueur + une direction. Le dernier côté se ferme tout seul.</p>`;
    st.irr.sides.forEach((s,i)=>{h+=`<div class="side"><b>C${i+1}</b><input class="num${num(s.l)>0?'':' bad'}" inputmode="decimal" data-sl="${i}" value="${H(s.l)}"><span class="unit">m</span>
      <select data-sd="${i}">${DIRS.map(([v,n])=>`<option value="${v}"${s.d===v?' selected':''}>${n}</option>`).join('')}</select>
      ${s.d==='a'?`<input class="num ang${isFinite(num(s.a))?'':' bad'}" inputmode="decimal" data-sa="${i}" value="${H(s.a)}" placeholder="0-360"><span class="unit">°</span>`:''}
      ${st.irr.sides.length>2?`<button class="x" type="button" data-sx="${i}" title="Supprimer ce côté">✕</button>`:''}</div>`;});
    h+=`<button class="btn s" type="button" id="addSide">+ Ajouter un côté</button>`;
    const pl=irrPoly();h+=`<p class="hint" id="closeInfo">${closeTxt(pl)}</p>`;
    h+=`<canvas id="plan"></canvas><p class="hint">Touche un côté du dessin pour choisir le <b style="color:#c62828">bord bas du toit</b>.</p>`;
    h+=`<div class="row"><span>Bord bas du toit</span><select data-k="irr.low" id="lowSel">${pl.P.map((p,i)=>`<option value="${i}"${st.irr.low===i?' selected':''}>Côté C${i+1}</option>`).join('')}</select></div>`;
    h+=fld('Hauteur mur bas','irr.hb');
    h+=`<div class="row"><span>Pente du toit</span><input class="num${isFinite(num(st.irr.p))?'':' bad'}" inputmode="decimal" data-k="irr.p" value="${H(st.irr.p)}"><select data-k="irr.pu"><option value="%"${st.irr.pu==='%'?' selected':''}>%</option><option value="°"${st.irr.pu==='°'?' selected':''}>°</option></select></div>`;
  }
  h+=`</section><section class="card"><h2>3. Pannes</h2><p class="hint">Distance entre les pannes, en partant toujours du bord bas du toit, mesurée le long de la pente.</p>`;
  if(t==='mono')h+=list('Pannes','pans.mono',panLab);
  else if(t==='bi')h+=list('Versant gauche','pans.biG',panLab)+list('Versant droit','pans.biD',panLab);
  else h+=list('Pannes','pans.irr',panLab);
  h+=`</section><section class="card"><h2>4. Travées</h2>`+list('Travées','trav',i=>'Travée '+(i+1),t==='irr'?'Les travées se suivent le long du bord bas du toit.':'')+`</section>`;
  h+=`<section class="card"><h2>Résultat</h2><div id="warns"></div><div id="info"></div></section>`;
  $('#form').innerHTML=h;
  if(t==='irr')drawPlan();
  updateInfo();
}
function closeTxt(pl){return pl.closeLen>0.005?`Côté de fermeture C${pl.P.length} (calculé) : <b>${f2(pl.closeLen)} m</b>`:'Le contour est fermé.';}

// ---------------------------------------------------------------- forme irrégulière : contour
function irrPoly(){const P=[[0,0]];let x=0,y=0;
  st.irr.sides.forEach(s=>{const l=num(s.l);const a=s.d==='a'?num(s.a):Number(s.d);if(!(l>0)||!isFinite(a))return;const r=a*Math.PI/180;x+=l*Math.cos(r);y+=l*Math.sin(r);if(Math.abs(x)<1e-9)x=0;if(Math.abs(y)<1e-9)y=0;P.push([x,y]);});
  let closeLen=Math.hypot(x,y);if(closeLen<0.005){P.pop();closeLen=0;}
  if(st.irr.low>=P.length)st.irr.low=0;return {P,closeLen};}
function polyArea(P){let a=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];a+=p[0]*q[1]-q[0]*p[1];}return a/2;}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
let planGeo=null;
function drawPlan(){const cv=$('#plan');if(!cv)return;const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(10,r.width*dpr);cv.height=Math.max(10,r.height*dpr);
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);const {P}=irrPoly();planGeo=null;if(P.length<2)return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;P.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});
  const pad=30,s=Math.min((r.width-2*pad)/Math.max(x1-x0,0.01),(r.height-2*pad)/Math.max(y1-y0,0.01));const ox=(r.width-(x1-x0)*s)/2-x0*s,oy=(r.height-(y1-y0)*s)/2-y0*s;
  const T=p=>[ox+p[0]*s,oy+p[1]*s];planGeo={T,s,ox,oy,P};
  g.beginPath();P.forEach((p,i)=>{const q=T(p);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);});g.closePath();g.fillStyle='#e3ece6';g.fill();
  const area=polyArea(P);
  P.forEach((p,i)=>{const a=T(p),b=T(P[(i+1)%P.length]);const low=i===st.irr.low;g.strokeStyle=low?'#c62828':'#1d2a24';g.lineWidth=low?5:2;g.setLineDash(i===P.length-1&&irrPoly().closeLen>0?[6,4]:[]);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();g.setLineDash([]);
    const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;let nx=dy/L,ny=-dx/L;const pm=[(p[0]+P[(i+1)%P.length][0])/2,(p[1]+P[(i+1)%P.length][1])/2];if(inPoly(pm[0]+nx/s*3,pm[1]+ny/s*3,P)){nx=-nx;ny=-ny;}
    const lx=mx+nx*14,ly=my+ny*14;g.fillStyle=low?'#c62828':'#1d6b4f';g.beginPath();g.arc(lx,ly,11,0,7);g.fill();g.fillStyle='#fff';g.font='bold 11px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText('C'+(i+1),lx,ly+0.5);});
}
function planTap(e){if(!planGeo)return;const r=e.target.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const {T,P}=planGeo;let best=-1,bd=Infinity;
  P.forEach((p,i)=>{const a=T(p),b=T(P[(i+1)%P.length]);const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy||1;let k=((x-a[0])*dx+(y-a[1])*dy)/l2;k=Math.max(0,Math.min(1,k));const d=Math.hypot(a[0]+k*dx-x,a[1]+k*dy-y);if(d<bd){bd=d;best=i;}});
  if(best>=0&&bd<40){st.irr.low=best;const s=$('#lowSel');if(s)s.value=String(best);drawPlan();rebuild(true);}}

// ---------------------------------------------------------------- 3D
let renderer,scene,camera,controls,grp,LS=0.5,ok3d=false,model=null;
function init3d(){const v=$('#view');
  if(!window.THREE||!THREE.OrbitControls){$('#vmsg').style.display='flex';$('#vmsg').textContent='La 3D n’a pas pu se charger. Vérifie la connexion internet puis recharge la page.';return;}
  try{renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});}catch(e){$('#vmsg').style.display='flex';$('#vmsg').textContent='Cet appareil ne sait pas afficher la 3D.';return;}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setClearColor(0xeef2f4,1);v.insertBefore(renderer.domElement,v.firstChild);
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(40,1,0.1,2000);
  scene.add(new THREE.HemisphereLight(0xffffff,0x8a9a90,0.85));const d=new THREE.DirectionalLight(0xffffff,0.55);d.position.set(-40,80,-60);scene.add(d);
  controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.12;controls.maxPolarAngle=Math.PI*0.495;controls.screenSpacePanning=true;
  const ro=new ResizeObserver(resize);ro.observe(v);resize();ok3d=true;
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();}
function resize(){if(!renderer)return;const v=$('#view'),w=v.clientWidth,h=v.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);renderer.domElement.style.width=w+'px';renderer.domElement.style.height=h+'px';camera.aspect=w/h;camera.updateProjectionMatrix();}
function disposeGrp(){if(!grp)return;scene.remove(grp);grp.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const m=o.material;if(m.map)m.map.dispose();m.dispose();}});grp=null;}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function mats(){const tr=$('#oTransp').checked;return {
  roof:new THREE.MeshLambertMaterial({color:0x8fb0c8,transparent:true,opacity:tr?0.32:0.92,side:THREE.DoubleSide,depthWrite:!tr}),
  wall:new THREE.MeshLambertMaterial({color:0xe6dfd2,transparent:true,opacity:tr?0.45:0.95,side:THREE.DoubleSide,depthWrite:!tr}),
  pan:new THREE.MeshLambertMaterial({color:0xe8862a}),fr:new THREE.MeshLambertMaterial({color:0x2c4a8a}),
  edge:new THREE.LineBasicMaterial({color:0x33413a}),dim:new THREE.LineBasicMaterial({color:0x1d6b4f})};}
function tris(pts,idx,mat){const g=new THREE.BufferGeometry();const a=[];idx.forEach(i=>{const p=pts[i];a.push(p.x,p.y,p.z);});g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));g.computeVertexNormals();const m=new THREE.Mesh(g,mat);grp.add(m);return m;}
function poly3(pts,mat){// polygone plan quelconque (projeté sur son meilleur plan)
  const n=new THREE.Vector3();for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];n.x+=(a.y-b.y)*(a.z+b.z);n.y+=(a.z-b.z)*(a.x+b.x);n.z+=(a.x-b.x)*(a.y+b.y);}
  const ax=Math.abs(n.x),ay=Math.abs(n.y),az=Math.abs(n.z);const pr=ay>=ax&&ay>=az?p=>new THREE.Vector2(p.x,p.z):ax>=az?p=>new THREE.Vector2(p.y,p.z):p=>new THREE.Vector2(p.x,p.y);
  const f=THREE.ShapeUtils.triangulateShape(pts.map(pr),[]);const idx=[];f.forEach(t=>idx.push(t[0],t[1],t[2]));return tris(pts,idx,mat);}
function lines(arr,mat){const g=new THREE.BufferGeometry();const a=[];arr.forEach(p=>a.push(p.x,p.y,p.z));g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));const l=new THREE.LineSegments(g,mat);grp.add(l);return l;}
function loop3(pts,mat){const a=[];pts.forEach((p,i)=>{a.push(p,pts[(i+1)%pts.length]);});return lines(a,mat);}
function beam(p1,p2,w,h,mat){const d=p2.clone().sub(p1),L=d.length();if(L<1e-4)return;const g=new THREE.BoxGeometry(L,h,w);const m=new THREE.Mesh(g,mat);m.position.copy(p1).add(p2).multiplyScalar(0.5);
  const dir=d.normalize();m.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),dir);if(Math.abs(dir.y)<0.99){const up=new THREE.Vector3(0,1,0);const side=new THREE.Vector3().crossVectors(dir,up).normalize();const yy=new THREE.Vector3().crossVectors(side,dir).normalize();const M=new THREE.Matrix4().makeBasis(dir,yy,side);m.quaternion.setFromRotationMatrix(M);}grp.add(m);}
function rr(k,x,y,w,h,r){k.beginPath();k.moveTo(x+r,y);k.arcTo(x+w,y,x+w,y+h,r);k.arcTo(x+w,y+h,x,y+h,r);k.arcTo(x,y+h,x,y,r);k.arcTo(x,y,x+w,y,r);k.closePath();}
let cotes=[];
function label(txt,p,col,big){if(!$('#oCotes').checked)return;const c=document.createElement('canvas'),k=c.getContext('2d');const fs=44;k.font='bold '+fs+'px Arial';const w=Math.ceil(k.measureText(txt).width)+26,h=fs+18;c.width=w;c.height=h;
  k.font='bold '+fs+'px Arial';k.fillStyle='rgba(255,255,255,.93)';rr(k,2,2,w-4,h-4,12);k.fill();k.strokeStyle=col||'#1d6b4f';k.lineWidth=4;k.stroke();k.fillStyle=col||'#1d6b4f';k.textAlign='center';k.textBaseline='middle';k.fillText(txt,w/2,h/2+2);
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));s.renderOrder=10;const sc=LS*(big?1.15:1);s.scale.set(sc*w/h,sc,1);s.position.copy(p);grp.add(s);}
function dim(p1,p2,txt,col){if(!$('#oCotes').checked)return;const m=new THREE.LineBasicMaterial({color:col||0x1d6b4f});const d=p2.clone().sub(p1);const L=d.length();if(L<1e-4)return;
  // trait de cote + petits tirets aux extrémités
  const t=LS*0.35;let perp=new THREE.Vector3().crossVectors(d,new THREE.Vector3(0,1,0));if(perp.length()<1e-6)perp=new THREE.Vector3(1,0,0);perp.normalize().multiplyScalar(t);
  lines([p1,p2,p1.clone().add(perp),p1.clone().sub(perp),p2.clone().add(perp),p2.clone().sub(perp)],m);label(txt,p1.clone().add(p2).multiplyScalar(0.5),col);}

// segments d'une droite « f(p)=v » à l'intérieur du polygone, exprimés avec la coordonnée g(p)
function segs(P,f,g,v){const xs=[];for(let i=0;i<P.length;i++){const A=P[i],B=P[(i+1)%P.length],fa=f(A),fb=f(B);if((fa<=v&&fb>v)||(fb<=v&&fa>v)){const k=(v-fa)/(fb-fa);xs.push(g(A)+k*(g(B)-g(A)));}}xs.sort((a,b)=>a-b);const r=[];for(let i=0;i+1<xs.length;i+=2)if(xs[i+1]-xs[i]>1e-6)r.push([xs[i],xs[i+1]]);return r;}

// ---------------------------------------------------------------- calcul du modèle (sans 3D) : sert à la vue, aux avertissements et au PDF
function computeModel(){const t=st.type,W=[];const trav=st.trav.map(num),T=cum(st.trav),Ltr=sum(st.trav);
  if(trav.some(x=>!(x>0)))W.push('Une largeur de travée est vide ou à zéro.');
  const M={type:t,warns:W,trav,T,Ltr};
  if(t==='bi'){const Wd=num(st.bi.W),h=num(st.bi.h),hf=num(st.bi.hf);if(!(Wd>0&&h>0&&hf>0)){W.push('Remplis la largeur, la hauteur des murs et la hauteur au faîtage.');return M;}
    if(hf<=h)W.push('La hauteur au faîtage doit être plus grande que celle des murs.');
    const run=Wd/2,rise=hf-h,ramp=Math.hypot(run,rise),cs=run/ramp;Object.assign(M,{ok:Ltr>0&&hf>h,Wd,h,hf,ramp,slope:rise/run,cs,L:Ltr});
    [['pans.biG','gauche'],['pans.biD','droit']].forEach(([k,n])=>{const c=cum(getK(k));if(getK(k).some(v=>!(num(v)>=0)))W.push('Pannes versant '+n+' : une distance est vide.');c.forEach((d,i)=>{if(d>ramp+1e-6)W.push(`Versant ${n} : P${i+1} est à ${f2(d)} m du bas, plus loin que le rampant (${f2(ramp)} m).`);});});
    return M;}
  let P,low,hb,slope;
  if(t==='mono'){const Wd=num(st.mono.W),h1=num(st.mono.h1),h2=num(st.mono.h2);if(!(Wd>0&&h1>0&&h2>0)){W.push('Remplis la largeur et les deux hauteurs.');return M;}
    if(h2<=h1)W.push('Le mur haut doit être plus haut que le mur bas.');
    const L=Ltr>0?Ltr:1;P=[[0,0],[L,0],[L,Wd],[0,Wd]];low=0;hb=h1;slope=(h2-h1)/Wd;Object.assign(M,{Wd,h1,h2,L:Ltr});if(!(h2>h1)||!(Ltr>0))return M;}
  else{const pl=irrPoly();P=pl.P;M.closeLen=pl.closeLen;if(st.irr.sides.some(s=>!(num(s.l)>0)))W.push('Un côté du contour n’a pas de longueur.');
    if(P.length<3||Math.abs(polyArea(P))<0.01){W.push('Le contour doit avoir au moins 3 côtés.');return M;}
    low=st.irr.low;hb=num(st.irr.hb);const p=num(st.irr.p);if(!(hb>0)||!(p>0)){W.push('Remplis la hauteur du mur bas et la pente.');return M;}
    slope=st.irr.pu==='%'?p/100:Math.tan(Math.min(p,80)*Math.PI/180);M.hb=hb;}
  const n=P.length,a=P[low],b=P[(low+1)%n];let ux=b[0]-a[0],uz=b[1]-a[1];const ul=Math.hypot(ux,uz)||1;ux/=ul;uz/=ul;let nx=-uz,nz=ux;
  if(!inPoly((a[0]+b[0])/2+nx*0.01,(a[1]+b[1])/2+nz*0.01,P)){nx=-nx;nz=-nz;}
  const q=p=>(p[0]-a[0])*nx+(p[1]-a[1])*nz,tt=p=>p[0]*ux+p[1]*uz,ta=tt(a);
  const pt=(Q,Tv)=>[a[0]+nx*Q+ux*(Tv-ta),a[1]+nz*Q+uz*(Tv-ta)];
  let qmax=0,qmin=0,tmin=Infinity,tmax=-Infinity;P.forEach(p=>{qmax=Math.max(qmax,q(p));qmin=Math.min(qmin,q(p));tmin=Math.min(tmin,tt(p));tmax=Math.max(tmax,tt(p));});
  if(qmin<-0.01)W.push('Une partie du bâtiment est plus basse que le bord bas choisi : vérifie le côté « bord bas ».');
  const cs=1/Math.sqrt(1+slope*slope),ramp=qmax/cs;
  Object.assign(M,{ok:true,P,low,hb,slope,cs,q,tt,pt,qmax,tmin,tmax,ramp,hmax:hb+slope*qmax,ux,uz,nx,nz,L:tmax-tmin});
  const k=t==='mono'?'pans.mono':'pans.irr';const c=cum(getK(k));if(getK(k).some(v=>!(num(v)>=0)))W.push('Pannes : une distance est vide.');
  c.forEach((d,i)=>{if(d>ramp+1e-6)W.push(`P${i+1} est à ${f2(d)} m du bas, plus loin que le haut du toit (rampant ${f2(ramp)} m).`);});
  if(t==='irr'&&Ltr>0&&Math.abs(Ltr-(tmax-tmin))>0.05)W.push(`Les travées font ${f2(Ltr)} m au total, mais le bâtiment fait ${f2(tmax-tmin)} m le long du bord bas.`);
  return M;}

function rebuild(fit){model=computeModel();updateInfo();if(!ok3d)return;disposeGrp();grp=new THREE.Group();scene.add(grp);const M=model;
  if(M.ok){const mm=mats();const size=Math.max(M.L||10,M.Wd||0,M.qmax||0,(M.hmax||M.hf||M.h2||5));LS=Math.max(0.35,Math.min(1.6,size*0.032));
    if(M.type==='bi')buildBi(M,mm);else buildPlane(M,mm);
    const box=new THREE.Box3().setFromObject(grp),sz=box.getSize(new THREE.Vector3()),ce=box.getCenter(new THREE.Vector3());
    const gs=Math.ceil(Math.max(sz.x,sz.z)*1.6/5)*5||20;const grid=new THREE.GridHelper(gs,Math.max(4,Math.round(gs)),0xb8c4bd,0xd6ddd9);grid.position.set(ce.x,0,ce.z);grp.add(grid);
    if(fit||!rebuild.done){fitView(box);rebuild.done=true;}}
  const w=$('#vwarn');w.style.display=M.warns.length?'block':'none';w.textContent=M.warns.length?'⚠️ '+M.warns[0]+(M.warns.length>1?` (+${M.warns.length-1})`:''):'';}
function fitView(box){box=box||new THREE.Box3().setFromObject(grp);const sz=box.getSize(new THREE.Vector3()),ce=box.getCenter(new THREE.Vector3());const r=Math.max(sz.x,sz.y,sz.z)*0.5+0.5;
  const dist=r/Math.sin(camera.fov*Math.PI/360)*Math.max(1,1.15/Math.max(camera.aspect,0.6));const dir=new THREE.Vector3(-0.85,0.7,-1.1).normalize();
  controls.target.copy(ce);camera.position.copy(ce).add(dir.multiplyScalar(dist*0.9));camera.near=Math.max(0.05,dist/200);camera.far=dist*20;camera.updateProjectionMatrix();controls.update();}

function buildPlane(M,mm){const {P,hb,slope,q,pt,tmin,tmax,cs}=M;const Y=p=>hb+slope*q(p);
  const roof=P.map(p=>V(p[0],Y(p),p[1])),ground=P.map(p=>V(p[0],0,p[1]));poly3(roof,mm.roof);
  P.forEach((p,i)=>{const j=(i+1)%P.length;tris([ground[i],ground[j],roof[j],roof[i]],[0,1,2,0,2,3],mm.wall);});
  loop3(roof,mm.edge);loop3(ground,mm.edge);const vv=[];P.forEach((p,i)=>vv.push(ground[i],roof[i]));lines(vv,mm.edge);
  const low=[roof[M.low],roof[(M.low+1)%P.length]];lines(low,new THREE.LineBasicMaterial({color:0xc62828}));
  const k=M.type==='mono'?'pans.mono':'pans.irr',c=cum(getK(k));const off=LS*1.6,ph=0.2,pw=0.12;
  // pannes
  c.forEach((d,i)=>{const Q=d*cs;if(Q>M.qmax+1e-6)return;const y=hb+slope*Q-ph/2-0.02;segs(P,q,M.tt,Math.min(Q,M.qmax-1e-4)).forEach(([t0,t1],si)=>{const a=pt(Q,t0),b=pt(Q,t1);beam(V(a[0],y,a[1]),V(b[0],y,b[1]),pw,ph,mm.pan);if(si===0){const e=pt(Q,t1+off*0.6);label('P'+(i+1),V(e[0],y+ph,e[1]),'#b55d0c');}});});
  // écarts entre pannes (côté début du bâtiment)
  let prev=0;c.forEach((d,i)=>{const Q0=prev*cs,Q1=Math.min(d,M.ramp)*cs;prev=d;if(Q1<=Q0)return;const a=pt(Q0,tmin-off),b=pt(Q1,tmin-off);dim(V(a[0],hb+slope*Q0+0.15,a[1]),V(b[0],hb+slope*Q1+0.15,b[1]),f2(d-(i?c[i-1]:0)),'#b55d0c');});
  // portiques (un à chaque séparation de travée)
  const Ts=[0].concat(M.T);Ts.forEach(Tv=>{let t=tmin+Tv;if(t>tmax+1e-6)return;t=Math.max(tmin+1e-3,Math.min(tmax-1e-3,t));segs(P,M.tt,q,t).forEach(([q0,q1])=>{const a=pt(q0,t),b=pt(q1,t),ya=hb+slope*q0,yb=hb+slope*q1;
    beam(V(a[0],0,a[1]),V(a[0],ya-0.28,a[1]),0.18,0.18,mm.fr);beam(V(b[0],0,b[1]),V(b[0],yb-0.28,b[1]),0.18,0.18,mm.fr);beam(V(a[0],ya-0.28,a[1]),V(b[0],yb-0.28,b[1]),0.16,0.3,mm.fr);});});
  // cotes des travées (le long du bord bas) + longueur
  let t0=0;M.T.forEach((Tv,i)=>{const a=pt(-off,tmin+t0),b=pt(-off,tmin+Tv);dim(V(a[0],0.05,a[1]),V(b[0],0.05,b[1]),f2(Tv-t0));t0=Tv;});
  if(M.type==='mono'){const a=pt(-off*2.3,tmin),b=pt(-off*2.3,tmax);dim(V(a[0],0.05,a[1]),V(b[0],0.05,b[1]),'Longueur '+f2(M.L),'#1d2a24');
    const c0=pt(0,tmin-off*2.3),c1=pt(M.qmax,tmin-off*2.3);dim(V(c0[0],0.05,c0[1]),V(c1[0],0.05,c1[1]),'Largeur '+f2(M.Wd),'#1d2a24');
    const h1=pt(-off*0.6,tmin-off*0.6);dim(V(h1[0],0,h1[1]),V(h1[0],M.h1,h1[1]),'h '+f2(M.h1),'#2c4a8a');const h2=pt(M.qmax+off*0.6,tmin-off*0.6);dim(V(h2[0],0,h2[1]),V(h2[0],M.h2,h2[1]),'h '+f2(M.h2),'#2c4a8a');}
  else{P.forEach((p,i)=>{const j=(i+1)%P.length,b=P[j];const mx=(p[0]+b[0])/2,mz=(p[1]+b[1])/2;let dx=b[0]-p[0],dz=b[1]-p[1];const L=Math.hypot(dx,dz)||1;let nx=dz/L,nz=-dx/L;if(inPoly(mx+nx*0.05,mz+nz*0.05,P)){nx=-nx;nz=-nz;}
      if(i!==M.low)label('C'+(i+1)+' '+f2(L),V(mx+nx*off*0.9,0.1,mz+nz*off*0.9),'#1d2a24');});
    const h1=pt(-off*0.6,tmin-off*0.6);dim(V(h1[0],0,h1[1]),V(h1[0],hb,h1[1]),'h '+f2(hb),'#2c4a8a');
    let im=0;P.forEach((p,i)=>{if(q(p)>q(P[im]))im=i;});const hp=P[im];label('h max '+f2(M.hmax),V(hp[0],M.hmax+LS*0.8,hp[1]),'#2c4a8a');}
}
function buildBi(M,mm){const {Wd:W,h,hf,L,cs,slope}=M,run=W/2;
  const A=V(0,h,0),B=V(L,h,0),C=V(L,hf,run),D=V(0,hf,run),E=V(0,h,W),F=V(L,h,W);
  tris([A,B,C,D],[0,1,2,0,2,3],mm.roof);tris([E,F,C,D],[0,1,2,0,2,3],mm.roof);
  const g=(x,z)=>V(x,0,z);tris([g(0,0),g(L,0),B,A],[0,1,2,0,2,3],mm.wall);tris([g(0,W),g(L,W),F,E],[0,1,2,0,2,3],mm.wall);
  poly3([g(0,0),g(0,W),E,D,A],mm.wall);poly3([g(L,0),g(L,W),F,C,B],mm.wall);
  loop3([g(0,0),g(L,0),g(L,W),g(0,W)],mm.edge);loop3([A,B,F,E],mm.edge);lines([D,C,A,D,E,D,B,C,F,C,g(0,0),A,g(L,0),B,g(L,W),F,g(0,W),E],mm.edge);
  const off=LS*1.6,ph=0.2,pw=0.12;
  [['pans.biG',1],['pans.biD',-1]].forEach(([k,sd])=>{const c=cum(getK(k));let prev=0;
    c.forEach((d,i)=>{const Q=Math.min(d*cs,run),z=sd>0?Q:W-Q,y=h+slope*Q-ph/2-0.02;if(d*cs<=run+1e-6){beam(V(0,y,z),V(L,y,z),pw,ph,mm.pan);label('P'+(i+1),V(L+off*0.6,y+ph,z),'#b55d0c');}
      const Q0=prev*cs,Q1=Math.min(d*cs,run);prev=d;if(Q1>Q0){const z0=sd>0?Q0:W-Q0,z1=sd>0?Q1:W-Q1;dim(V(-off,h+slope*Q0+0.15,z0),V(-off,h+slope*Q1+0.15,z1),f2(d-(i?c[i-1]:0)),'#b55d0c');}});});
  [0].concat(M.T).forEach(x=>{if(x>L+1e-6)return;beam(V(x,0,0),V(x,h-0.25,0),0.18,0.18,mm.fr);beam(V(x,0,W),V(x,h-0.25,W),0.18,0.18,mm.fr);beam(V(x,h-0.25,0),V(x,hf-0.25,run),0.16,0.3,mm.fr);beam(V(x,h-0.25,W),V(x,hf-0.25,run),0.16,0.3,mm.fr);});
  let t0=0;M.T.forEach(Tv=>{dim(V(t0,0.05,-off),V(Tv,0.05,-off),f2(Tv-t0));t0=Tv;});
  dim(V(0,0.05,-off*2.3),V(L,0.05,-off*2.3),'Longueur '+f2(L),'#1d2a24');dim(V(-off*2.3,0.05,0),V(-off*2.3,0.05,W),'Largeur '+f2(W),'#1d2a24');
  dim(V(-off*0.6,0,-off*0.6),V(-off*0.6,h,-off*0.6),'h '+f2(h),'#2c4a8a');dim(V(-off*2.3,0,run),V(-off*2.3,hf,run),'faîtage '+f2(hf),'#2c4a8a');}

// ---------------------------------------------------------------- récapitulatif (écran + PDF)
function recap(){const M=model||computeModel(),t=st.type,R={dims:[],pans:[],trav:[]};
  const deg=s=>Math.atan(s)*180/Math.PI;
  R.dims.push(['Type',{mono:'Monopente',bi:'Bipente',irr:'Forme irrégulière'}[t]]);
  if(t==='mono'){R.dims.push(['Largeur',f2(num(st.mono.W))+' m'],['Hauteur mur bas',f2(num(st.mono.h1))+' m'],['Hauteur mur haut',f2(num(st.mono.h2))+' m']);if(M.ok)R.dims.push(['Pente',f1(deg(M.slope))+'° ('+f1(M.slope*100)+' %)'],['Rampant',f2(M.ramp)+' m']);}
  else if(t==='bi'){R.dims.push(['Largeur',f2(num(st.bi.W))+' m'],['Hauteur des murs',f2(num(st.bi.h))+' m'],['Hauteur au faîtage',f2(num(st.bi.hf))+' m']);if(M.ramp)R.dims.push(['Pente',f1(deg(M.slope))+'° ('+f1(M.slope*100)+' %)'],['Rampant (par versant)',f2(M.ramp)+' m']);}
  else{const pl=irrPoly();pl.P.forEach((p,i)=>{const b=pl.P[(i+1)%pl.P.length];const s=st.irr.sides[i];const dir=i<st.irr.sides.length&&s?(s.d==='a'?f1(num(s.a))+'°':DIRW[s.d]):'fermeture';R.dims.push(['Côté C'+(i+1)+(i===st.irr.low?' (bord bas)':''),f2(Math.hypot(b[0]-p[0],b[1]-p[1]))+' m — '+dir]);});
    R.dims.push(['Hauteur mur bas',f2(num(st.irr.hb))+' m']);if(M.ok)R.dims.push(['Pente',f1(deg(M.slope))+'° ('+f1(M.slope*100)+' %)'],['Hauteur max',f2(M.hmax)+' m'],['Rampant max',f2(M.ramp)+' m']);}
  R.dims.push(['Longueur (travées)',f2(M.Ltr)+' m']);
  const pl=(k,title)=>{const a=getK(k),c=cum(a);R.pans.push([title+' — '+a.length+' panne'+(a.length>1?'s':''),'']);a.forEach((v,i)=>R.pans.push([(i?'P'+i+' → P'+(i+1):'Bord bas → P1'),f2(num(v))+' m (à '+f2(c[i])+' m du bas)']));};
  if(t==='bi'){pl('pans.biG','Versant gauche');pl('pans.biD','Versant droit');}else pl(t==='mono'?'pans.mono':'pans.irr','Pannes');
  R.trav.push([st.trav.length+' travée'+(st.trav.length>1?'s':''),'']);st.trav.forEach((v,i)=>R.trav.push(['Travée '+(i+1),f2(num(v))+' m']));
  return R;}
function updateInfo(){const M=model||computeModel();const w=$('#warns');if(w)w.innerHTML=M.warns.map(x=>`<div class="warn">⚠️ ${H(x)}</div>`).join('');
  const i=$('#info');if(!i)return;const R=recap();i.innerHTML='<table>'+R.dims.map(([a,b])=>`<tr><td>${H(a)}</td><td>${H(b)}</td></tr>`).join('')+'</table>';
  const ci=$('#closeInfo');if(ci)ci.innerHTML=closeTxt(irrPoly());}

  renderer.setPixelRatio(pr);renderer.setSize(ow/pr,oh/pr,false);camera.aspect=asp;camera.updateProjectionMatrix();renderer.render(scene,camera);return url;}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}

function saveImg(){if(!ok3d||!model||!model.ok){alert('Complète d’abord les dimensions.');return;}const v=$('#view'),r=Math.min(2,Math.max(1,1600/(v.clientWidth||800)));dl(snapshot(Math.round(v.clientWidth*r),Math.round(v.clientHeight*r)),'batiment-3d-'+stamp()+'.png');}

  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});const R=recap();
  const img=snapshot(1800,1100,'image/jpeg');doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(15,61,46);doc.text('Bâtiment 3D',10,13);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90,100,95);doc.text(new Date().toLocaleDateString('fr-FR'),287,13,{align:'right'});
  doc.addImage(img,'JPEG',10,18,180,110);doc.setDrawColor(200,210,204);doc.rect(10,18,180,110);
  const cols=[{x:197,y0:22,y1:200,w:90},{x:10,y0:138,y1:200,w:88},{x:104,y0:138,y1:200,w:88},{x:198,y0:138,y1:200,w:88}];
  // la colonne de droite (dimensions) occupe le haut ; les autres sont sous l'image
  cols[0].y1=128;
  let ci=0,y=cols[0].y0;const nextCol=()=>{ci++;if(ci>=cols.length){doc.addPage();cols.length=0;[10,80,150,220].forEach(x=>cols.push({x,y0:15,y1:200,w:66}));ci=0;}y=cols[ci].y0;};
  const head=t=>{if(y+16>cols[ci].y1)nextCol();doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(15,61,46);doc.text(pdfTxt(t),cols[ci].x,y);y+=5.5;};
  const line=(a,b,bold)=>{if(y+4.5>cols[ci].y1)nextCol();const c=cols[ci];doc.setFontSize(8.6);doc.setFont('helvetica',bold?'bold':'normal');doc.setTextColor(30,40,36);
    const left=doc.splitTextToSize(pdfTxt(a),b?c.w*0.5:c.w);doc.text(left[0],c.x,y);if(b){doc.setFont('helvetica','bold');doc.text(pdfTxt(b),c.x+c.w,y,{align:'right'});}y+=4.4;};
  head('Dimensions');R.dims.forEach(([a,b])=>line(a,b));
  if(ci===0)nextCol();else y+=3;head('Pannes (depuis le bord bas)');R.pans.forEach(([a,b])=>line(a,b,!b));
  y+=2;head('Travées');R.trav.forEach(([a,b])=>line(a,b,!b));
  if(model.warns.length){y+=2;head('À vérifier');model.warns.forEach(w=>line(w,''));}
  doc.save('batiment-3d-'+stamp()+'.pdf');}

// ---------------------------------------------------------------- événements
let tm=0;const later=()=>{clearTimeout(tm);tm=setTimeout(()=>rebuild(false),180);};
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.k){setK(el.dataset.k,el.tagName==='SELECT'&&el.dataset.k==='irr.low'?Number(el.value):el.value);if(el.classList.contains('num'))el.classList.toggle('bad',!isFinite(num(el.value)));if(el.dataset.k==='irr.low')drawPlan();later();}
  else if(el.dataset.l){getK(el.dataset.l)[+el.dataset.i]=el.value;el.classList.toggle('bad',!isFinite(num(el.value)));later();}
  else if(el.dataset.sl!=null){st.irr.sides[+el.dataset.sl].l=el.value;el.classList.toggle('bad',!(num(el.value)>0));drawPlan();refreshLow();later();}
  else if(el.dataset.sa!=null){st.irr.sides[+el.dataset.sa].a=el.value;el.classList.toggle('bad',!isFinite(num(el.value)));drawPlan();refreshLow();later();}});
function refreshLow(){const s=$('#lowSel');if(!s)return;const P=irrPoly().P;s.innerHTML=P.map((p,i)=>`<option value="${i}"${st.irr.low===i?' selected':''}>Côté C${i+1}</option>`).join('');}
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.cnt){let n=Math.round(num(el.value));const k=el.dataset.cnt,a=getK(k),min=k==='trav'?1:0;if(!isFinite(n))n=a.length;n=Math.max(min,Math.min(60,n));const last=a.length?a[a.length-1]:(k==='trav'?'6':'1,50');while(a.length<n)a.push(last);a.length=n;renderForm();rebuild(false);}
  else if(el.dataset.sd!=null){const s=st.irr.sides[+el.dataset.sd];s.d=el.value;if(s.d==='a'&&!s.a)s.a='30';renderForm();rebuild(true);}
  else if(el.id==='oCotes'||el.id==='oTransp')rebuild(false);});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.id==='plan')planTap(e);return;}
  if(b.dataset.t){st.type=b.dataset.t;renderForm();rebuild(true);}
  else if(b.dataset.all){const v=document.querySelector(`[data-allv="${b.dataset.all}"]`).value;if(!isFinite(num(v)))return;const a=getK(b.dataset.all);a.forEach((x,i)=>a[i]=v);renderForm();rebuild(false);}
  else if(b.dataset.sx!=null){st.irr.sides.splice(+b.dataset.sx,1);renderForm();rebuild(true);}
  else if(b.id==='addSide'){st.irr.sides.push({l:'5',d:'90',a:''});renderForm();rebuild(true);}
  else if(b.id==='bFit'){if(ok3d&&grp)fitView();}
  else if(b.id==='bImg')saveImg();else if(b.id==='bPdf')savePdf();});
window.addEventListener('resize',()=>{if(st.type==='irr')drawPlan();});

renderForm();init3d();rebuild(true);
</script>
