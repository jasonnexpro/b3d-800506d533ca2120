<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Bâtiment 3D</title>
<!-- Bâtiment 3D v3 — 05/11/2026 — version PC : étapes, Plan / 3D, dessin à la souris, auvent, bardage, portes, local technique et câble. Rien n'est enregistré. -->
<style>
:root{--g:#0f3d2e;--g2:#1d6b4f;--bg:#eef1ee;--card:#fff;--line:#d5ddd7;--txt:#1d2a24;--mut:#5b6b63;--red:#c62828;--warn:#9a5b00;--wbg:#fff4e0;--ok:#1b7a3d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);background:var(--bg);min-width:1200px;overflow:hidden}
header{height:52px;background:var(--g);color:#fff;padding:0 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
.btn{border:0;border-radius:8px;padding:8px 13px;font-weight:700;font-size:14px;cursor:pointer;background:#fff;color:var(--g);font-family:inherit}
.btn:hover{filter:brightness(.95)}
.btn.y{background:#f2c230;color:#222}
.btn.s{padding:5px 10px;font-size:13px;background:#e7efe9}
.btn.on{background:var(--g);color:#fff}
.btn.r{background:#fbe9e9;color:var(--red)}
#app{display:grid;grid-template-columns:420px 1fr;height:calc(100% - 52px)}
#side{overflow:auto;border-right:1px solid var(--line);padding:10px 12px 60px;background:#f6f8f6}
#work{position:relative;display:flex;flex-direction:column;min-width:0}
#wbar{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#fff;border-bottom:1px solid var(--line)}
#wbar .tabs{display:flex;gap:4px;background:#e7efe9;border-radius:9px;padding:3px}
#wbar .tabs button{border:0;background:transparent;border-radius:7px;padding:6px 16px;font-weight:700;font-size:14px;color:var(--g);cursor:pointer;font-family:inherit}
#wbar .tabs button.on{background:var(--g);color:#fff}
#wbar .sep{flex:1}
#wbar label{font-size:13px;font-weight:600;display:flex;gap:5px;align-items:center}
#stage{position:relative;flex:1;min-height:0}
#v3d,#plan{position:absolute;inset:0;width:100%;height:100%}
#v3d canvas{display:block;width:100%;height:100%}
#plan{background:#fbfcfb;cursor:crosshair;display:block}
#banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--g);color:#fff;border-radius:10px;padding:8px 16px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none;white-space:nowrap;display:none}
#banner b{color:#f2c230}
#vmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:600;color:var(--red)}
#warnbar{max-height:110px;overflow:auto;background:#fff;border-top:1px solid var(--line);padding:6px 12px;font-size:13px}
#warnbar .w{color:var(--warn);font-weight:600;margin:2px 0}
#warnbar .okk{color:var(--ok);font-weight:600}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;overflow:hidden}
.step>h2{margin:0;font-size:15px;padding:11px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--g)}
.step>h2 .n{background:var(--g);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.step>h2 .sum{margin-left:auto;font-size:12px;color:var(--mut);font-weight:500}
.step.open>h2{border-bottom:1px solid #edf1ee}
.step .body{display:none;padding:8px 12px 12px}
.step.open .body{display:block}
.step h3{font-size:14px;margin:12px 0 6px;color:var(--g2)}
.seg{display:flex;gap:4px;background:#e7efe9;border-radius:10px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--g);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--g);color:#fff}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.row>span:first-child{flex:1;font-size:14px}
input.num,select{font:inherit;font-size:14px;padding:5px 7px;border:1px solid #b9c6be;border-radius:7px;background:#fff;color:var(--txt)}
input.num{width:84px;text-align:right}
.unit{color:var(--mut);font-size:13px;width:14px}
.bad{border-color:var(--red)!important;background:#fff2f2!important}
.hint{font-size:12.5px;color:var(--mut);margin:4px 0 6px;line-height:1.45}
.next{margin-top:10px;width:100%}
table.vt{width:100%;border-collapse:collapse;font-size:13px}
table.vt th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:3px 2px}
table.vt td{padding:2px;border-top:1px solid #f0f3f1}
table.vt td.cu{color:var(--mut);text-align:right;width:58px}
table.vt input.num{width:74px}
table.vt tr.tot td{background:#f5f8f6}
.chk{font-size:13px;font-weight:700;margin:6px 0}
.chk.ok{color:var(--ok)}.chk.ko{color:var(--warn)}
.vbox{border:1px solid #e3e9e5;border-radius:10px;padding:8px 10px;margin:8px 0;background:#fcfdfc}
.vbox h3{margin-top:0}
.fac{border:1px solid #e3e9e5;border-radius:10px;padding:6px 9px;margin:6px 0;background:#fcfdfc}
.fac .ft{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--g2)}
.fac .ft span{flex:1}
.pc{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:13px}
.pc>span:first-child{width:118px}
.pc input.num{width:58px}
#info table{width:100%;border-collapse:collapse;font-size:13px}
#info td{padding:3px 2px;border-bottom:1px solid #edf1ee}
#info td:last-child{text-align:right;font-weight:600}
#lenEdit{position:absolute;display:none;z-index:5;width:90px;font-size:14px;padding:4px 6px;border:2px solid var(--g2);border-radius:6px;text-align:right}
.ptools{display:flex;gap:6px}
</style>
</head>
<body>
<header>
  <h1>🏗️ Bâtiment 3D</h1>
  <button class="btn" id="bImg" type="button">🖼️ Enregistrer l'image</button>
  <button class="btn y" id="bPdf" type="button">📄 Exporter le PDF</button>
</header>
<div id="app">
  <div id="side"></div>
  <div id="work">
    <div id="wbar">
      <div class="tabs"><button type="button" data-tab="plan">🗺️ Plan</button><button type="button" data-tab="3d">🧊 3D</button></div>
      <div class="ptools" id="ptools"></div>
      <span class="sep"></span>
      <label id="l1"><input type="checkbox" id="oCotes" checked> Cotes</label>
      <label id="l2"><input type="checkbox" id="oTransp" checked> Toit transparent</label>
      <button class="btn s" id="bFit" type="button">⟲ Recentrer</button>
    </div>
    <div id="stage">
      <div id="v3d"></div>
      <canvas id="plan"></canvas>
      <div id="banner"></div>
      <input id="lenEdit" inputmode="decimal">
      <div id="vmsg"></div>
    </div>
    <div id="warnbar"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';
// ================================================================ outils
const $=s=>document.querySelector(s);
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.').replace(/\s/g,''));return isFinite(x)?x:NaN;};
const f2=x=>isFinite(x)?(Math.round(x*100)/100).toFixed(2).replace('.',','):'—';
const f1=x=>isFinite(x)?(Math.round(x*10)/10).toFixed(1).replace('.',','):'—';
const H=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cum=a=>{let s=0;return a.map(v=>s+=(num(v)||0));};
const sum=a=>a.reduce((s,v)=>s+(num(v)||0),0);
const ORI=['nord','nord-est','est','sud-est','sud','sud-ouest','ouest','nord-ouest'];
const FAIT={vent:'Faîtage ventilé',boudin:'Faîtage boudin',plat:'Faîtage plat'};
const TYPES={mono:'Monopente',bi:'Bipente',irr:'Forme irrégulière'};
const KEYS={mono:['m'],bi:['A','B'],irr:['A','B']};
const rep=(v,n)=>Array.from({length:n},()=>v);

// ================================================================ données (rien n'est enregistré)
const VER=(pans,last,tDeb,tHaut)=>({deb:'0,30',pans,last,tDeb,tHaut,cass:'',auv:false,aw:'4'});
const LOC=on=>({on,side:0,piece:on?1:0,L:'2,50',P:'2,00',Hh:'2,50',gap:'0,80',ent:'0,60'});
const st={
  type:'bi',north:0,fait:'vent',tab:'3d',step:1,
  mono:{W:'10',h1:'5'},
  bi:{W:'12',hA:'6',hB:'6'},
  irr:{pts:[[0,0],[16,0],[16,6],[10,6],[10,11],[0,11]],ridge:[[0,3],[16,3]],h:'5',mode:'edit'},
  vers:{
    mono:{m:VER(['0,40'].concat(rep('1,65',6)),'0,20','10,25','10,50')},
    bi:{A:VER(['0,40'].concat(rep('1,50',4)),'0,22','6,37','6,62'),B:VER(['0,40'].concat(rep('1,50',4)),'0,22','6,37','6,62')},
    irr:{A:VER(['0,40'].concat(rep('1,60',5)),'0,15','8,30','8,55'),B:VER(['0,40','1,60','1,60'],'0,31','3,66','3,91')}},
  trav:{mono:rep('6',5),bi:rep('6',5),irr:rep('4',4)},
  fac:{mono:{},bi:{},irr:{}},
  loc:{mono:LOC(false),bi:LOC(true),irr:LOC(false)}
};
const getK=k=>k.split('.').reduce((o,p)=>o[p],st);
const setK=(k,v)=>{const p=k.split('.'),l=p.pop();p.reduce((o,q)=>o[q],st)[l]=v;};

// ================================================================ orientation
function northVec(){const a=st.north*Math.PI/4;return [Math.sin(a),-Math.cos(a)];}
function oriName(d){const N=northVec(),E=[-N[1],N[0]];let b=Math.atan2(d[0]*E[0]+d[1]*E[1],d[0]*N[0]+d[1]*N[1])*180/Math.PI;if(b<0)b+=360;return ORI[Math.round(b/45)%8];}

// ================================================================ géométrie plane
function polyArea(P){let a=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];a+=p[0]*q[1]-q[0]*p[1];}return a/2;}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function clipHalf(P,f){const out=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],fa=f(a),fb=f(b);if(fa>=0)out.push(a);if((fa>=0)!==(fb>=0)){const k=fa/(fa-fb);out.push([a[0]+k*(b[0]-a[0]),a[1]+k*(b[1]-a[1])]);}}
  return out.filter((p,i)=>{const q=out[(i+1)%out.length];return Math.hypot(p[0]-q[0],p[1]-q[1])>1e-6;});}
function segs(P,f,g,v){const xs=[];for(let i=0;i<P.length;i++){const A=P[i],B=P[(i+1)%P.length],fa=f(A),fb=f(B);if((fa<=v&&fb>v)||(fb<=v&&fa>v)){const k=(v-fa)/(fb-fa);xs.push(g(A)+k*(g(B)-g(A)));}}xs.sort((a,b)=>a-b);const r=[];for(let i=0;i+1<xs.length;i+=2)if(xs[i+1]-xs[i]>1e-6)r.push([xs[i],xs[i+1]]);return r;}
function outward(P,i){const p=P[i],q=P[(i+1)%P.length],L=Math.hypot(q[0]-p[0],q[1]-p[1])||1;let n=[(q[1]-p[1])/L,-(q[0]-p[0])/L];const m=[(p[0]+q[0])/2,(p[1]+q[1])/2];if(inPoly(m[0]+n[0]*0.05,m[1]+n[1]*0.05,P))n=[-n[0],-n[1]];return n;}

// ================================================================ modèle (3D, plan, alertes, PDF)
function vNums(v){const c=cum(v.pans),last=num(v.last),tH=num(v.tHaut),tD=num(v.tDeb),deb=num(v.deb)||0;const sumR=(c.length?c[c.length-1]:0)+(isFinite(last)?last:0);return {deb,c,last,tH,tD,R:tH>0?tH:sumR,sumR,aw:v.auv?Math.max(0,num(v.aw)||0):0};}
function mkV(key,poly,O,e,d,run,hTop,hEave,n,ridge){const rise=hTop-hEave,Rw=Math.hypot(run,rise),cs=run/Rw,slope=rise/run;
  const dist=p=>(p[0]-O[0])*d[0]+(p[1]-O[1])*d[1],along=p=>(p[0]-O[0])*e[0]+(p[1]-O[1])*e[1];
  const pt=(ds,al)=>[O[0]+d[0]*ds+e[0]*al,O[1]+d[1]*ds+e[1]*al],y=ds=>hTop-slope*ds;const dh=n.deb*cs;
  const roof=poly.map(p=>dist(p)>=run-0.01?[p[0]+d[0]*dh,p[1]+d[1]*dh]:p);
  return {key,poly,roof,O,e,d,run,hTop,hEave,rise,Rw,cs,slope,dist,along,pt,y,dh,n,ridge,aw:n.aw,wallDist:run-n.aw,sd:s=>run+dh-s*cs,name:'Versant '+oriName(d)};}
function circles(W,hA,hB,rA,rB){const dz=W,dy=hB-hA,dd=Math.hypot(dz,dy);if(rA+rB<=dd)return {err:'short'};if(Math.abs(rA-rB)>=dd)return {err:'long'};
  const a=(rA*rA-rB*rB+dd*dd)/(2*dd),hh=Math.sqrt(Math.max(0,rA*rA-a*a));return {zr:a*dz/dd-hh*dy/dd,yr:hA+a*dy/dd+hh*dz/dd};}
function computeModel(){const t=st.type,W=[],M={type:t,warns:W,vs:[]};const trv=st.trav[t];M.T=cum(trv);M.Ltr=sum(trv);
  if(trv.some(x=>!(num(x)>0)))W.push('Une largeur de travée est vide ou à zéro.');
  const ns={};KEYS[t].forEach(k=>ns[k]=vNums(st.vers[t][k]));if(t==='irr')KEYS.irr.forEach(k=>ns[k].aw=0);
  if(t==='mono'){const Wd=num(st.mono.W),h1=num(st.mono.h1),n=ns.m;if(!(Wd>0&&h1>0)){W.push('Remplis la largeur et la hauteur du mur bas.');return M;}
    const Rt=n.R-n.deb,runT=Wd+n.aw;if(!(Rt>runT)){W.push(`Le toit (${f2(Rt)} m sans le débord) est plus court que la largeur${n.aw?' + l’auvent':''} (${f2(runT)} m) : vérifie « bas → haut du faîtage ».`);return M;}
    const slope=Math.sqrt(Rt*Rt-runT*runT)/runT,L=M.Ltr>0?M.Ltr:1;M.P=[[0,0],[L,0],[L,Wd],[0,Wd]];Object.assign(M,{Wd,h1,h2:h1+slope*Wd});
    const hp=h1-slope*n.aw;if(n.aw&&hp<1)W.push('Les poteaux de l’auvent seraient très bas ('+f2(hp)+' m) : vérifie la largeur de l’auvent.');
    M.vs.push(mkV('m',[[0,-n.aw],[L,-n.aw],[L,Wd],[0,Wd]],[0,Wd],[1,0],[0,-1],runT,M.h2,hp,n,false));}
  else if(t==='bi'){const Wd=num(st.bi.W),hA=num(st.bi.hA),hB=num(st.bi.hB);if(!(Wd>0&&hA>0&&hB>0)){W.push('Remplis la largeur et les deux hauteurs de mur.');return M;}
    const A=ns.A,B=ns.B;if(!(A.R-A.deb>0&&B.R-B.deb>0)){W.push('Remplis « bas → haut du faîtage » pour les deux versants.');return M;}
    let rA=A.R-A.deb-A.aw,rB=B.R-B.deb-B.aw,c=null;
    for(let k=0;k<40;k++){c=circles(Wd,hA,hB,rA,rB);if(c.err)break;rA=(A.R-A.deb)*c.zr/(c.zr+A.aw);rB=(B.R-B.deb)*(Wd-c.zr)/(Wd-c.zr+B.aw);}
    if(c.err==='short'){W.push('Les deux versants sont trop courts pour se rejoindre au faîtage : vérifie les cotes « bas → haut du faîtage »'+(A.aw||B.aw?' et la largeur de l’auvent':'')+'.');return M;}
    if(c.err){W.push('Un versant est beaucoup trop long par rapport à l’autre : vérifie les cotes « bas → haut du faîtage » (ou coche « auvent » si le toit continue au-delà du mur).');return M;}
    const {zr,yr}=c;if(!(zr>0.05&&zr<Wd-0.05)){W.push('Avec ces cotes, le faîtage tombe en dehors des murs : vérifie les cotes des versants (ou coche « auvent » si le toit continue au-delà du mur).');return M;}
    const L=M.Ltr>0?M.Ltr:1;M.P=[[0,0],[L,0],[L,Wd],[0,Wd]];Object.assign(M,{Wd,hA,hB,zr,yr});
    const sA=(yr-hA)/zr,sB=(yr-hB)/(Wd-zr);
    M.vs.push(mkV('A',[[0,-A.aw],[L,-A.aw],[L,zr],[0,zr]],[0,zr],[1,0],[0,-1],zr+A.aw,yr,hA-sA*A.aw,A,true));
    M.vs.push(mkV('B',[[0,zr],[L,zr],[L,Wd+B.aw],[0,Wd+B.aw]],[0,zr],[1,0],[0,1],Wd-zr+B.aw,yr,hB-sB*B.aw,B,true));
    M.vs.forEach(v=>{if(v.aw&&v.hEave<1)W.push(v.name+' : les poteaux de l’auvent seraient très bas ('+f2(v.hEave)+' m).');});}
  else{const P=st.irr.pts;if(P.length<3||st.irr.mode==='draw'){W.push('Dessine le contour du bâtiment sur le plan (au moins 3 coins), puis ferme-le.');return M;}
    const h=num(st.irr.h);if(!(h>0)){W.push('Remplis la hauteur des murs.');return M;}
    if(st.irr.ridge.length<2){W.push('Place le faîtage : clique 2 points sur le plan.');return M;}
    const R1=st.irr.ridge[0],R2=st.irr.ridge[1],el=Math.hypot(R2[0]-R1[0],R2[1]-R1[1]);if(el<0.1){W.push('Les 2 points du faîtage sont trop proches.');return M;}
    const e=[(R2[0]-R1[0])/el,(R2[1]-R1[1])/el],dA=[-e[1],e[0]];M.P=P;
    const halves=[1,-1].map(sg=>{const d=[dA[0]*sg,dA[1]*sg];const f=p=>(p[0]-R1[0])*d[0]+(p[1]-R1[1])*d[1];const poly=clipHalf(P,f);return {d,poly,run:poly.length>=3?Math.max(...poly.map(f)):0};});
    if(halves.some(x=>x.poly.length<3||x.run<0.2)){W.push('Le faîtage doit traverser le bâtiment (un versant de chaque côté).');return M;}
    const rises=halves.map((x,i)=>{const n=ns[KEYS.irr[i]],Rw=n.R-n.deb;return Rw>x.run?Math.sqrt(Rw*Rw-x.run*x.run):NaN;});
    halves.forEach((x,i)=>{if(!isFinite(rises[i]))W.push(`Versant ${oriName(x.d)} : le toit est plus court que la distance mur → faîtage (${f2(x.run)} m).`);});
    if(!rises.every(isFinite))return M;
    if(Math.abs(rises[0]-rises[1])>0.05)W.push(`Les deux versants donnent des hauteurs de faîtage différentes (${f2(h+rises[0])} et ${f2(h+rises[1])} m) : la moyenne est utilisée.`);
    const hr=h+(rises[0]+rises[1])/2;Object.assign(M,{h,yr:hr});
    halves.forEach((x,i)=>M.vs.push(mkV(KEYS.irr[i],x.poly,R1,e,x.d,x.run,hr,h,ns[KEYS.irr[i]],true)));}
  M.vs.forEach(v=>{const n=v.n,nm=v.name;if(st.vers[t][v.key].pans.some(x=>!(num(x)>=0)))W.push(nm+' : une distance de panne est vide.');
    if(n.tH>0&&isFinite(n.last)&&Math.abs(n.sumR-n.tH)>0.02)W.push(`${nm} : pannes + dernière panne = ${f2(n.sumR)} m, mais « bas → haut du faîtage » = ${f2(n.tH)} m.`);
    if(n.tD>0&&n.tH>0&&n.tD>n.tH)W.push(nm+' : « début du faîtage » est plus loin que « haut du faîtage ».');
    if(!(n.tD>0))W.push(nm+' : remplis « bas → début du faîtage ».');});
  const v0=M.vs[0];let emin=Infinity,emax=-Infinity;M.P.forEach(p=>{emin=Math.min(emin,v0.along(p));emax=Math.max(emax,v0.along(p));});Object.assign(M,{emin,emax,L:emax-emin,ok:true});
  if(t==='irr'&&M.Ltr>0&&Math.abs(M.Ltr-M.L)>0.05)W.push(`Les travées font ${f2(M.Ltr)} m au total, mais le bâtiment fait ${f2(M.L)} m le long du faîtage.`);
  M.sides=sidesOf(M);M.loc=locOf(M);return M;}
function roofH(M,p){const v=M.vs.length===1?M.vs[0]:(M.vs[0].dist(p)>=0?M.vs[0]:M.vs[1]);return v.y(v.dist(p));}
// façades : chaque côté du bâtiment, découpé par travée quand il suit le faîtage

  return R;}
function updateInfo(){const M=model||computeModel();const wb=$('#warnbar');if(wb)wb.innerHTML=M.warns.length?M.warns.map(x=>`<div class="w">⚠️ ${H(x)}</div>`).join(''):'<div class="okk">✓ Tout est cohérent.</div>';
  KEYS[st.type].forEach(k=>{const n=vNums(st.vers[st.type][k]);n.c.forEach((c,j)=>{const el=$(`#cu_${k}_${j}`);if(el)el.textContent=f2(c);});const el=$(`#cu_${k}_l`);if(el)el.textContent=f2(n.sumR);
    const ck=$('#chk_'+k);if(ck){const ok=n.tH>0&&Math.abs(n.sumR-n.tH)<=0.02;ck.className='chk '+(ok?'ok':'ko');ck.textContent=n.tH>0?(ok?'✓ Pannes + dernière panne = '+f2(n.sumR)+' m = bas → haut du faîtage':'⚠ Pannes + dernière panne = '+f2(n.sumR)+' m ≠ '+f2(n.tH)+' m'):'Remplis « bas → haut du faîtage »';}});
  const cb=$('#cable');if(cb){const L=M.loc;cb.innerHTML=L?`<table class="vt"><tr><td>Descente le long du mur (haut du mur → ${f2(L.ent)} m)</td><td class="cu"><b>${f2(L.desc)}</b></td></tr><tr><td>Traversée jusqu’au local</td><td class="cu"><b>${f2(L.gap)}</b></td></tr><tr class="tot"><td><b>Longueur totale du passage</b></td><td class="cu"><b>${f2(L.total)} m</b></td></tr></table>`:'';}
  const i=$('#info');if(!i)return;const R=recap();const tb=rows=>'<table>'+rows.map(([a,b])=>`<tr><td>${H(a)}</td><td>${H(b)}</td></tr>`).join('')+'</table>';
  i.innerHTML=tb(R.dims)+(R.fac.length?'<h3>Façades</h3>'+tb(R.fac):'')+(R.loc.length?'<h3>Local technique</h3>'+tb(R.loc):'');}

// ================================================================ image et PDF
function snapshot(W,Hh,type){const cv=renderer.domElement,ow=cv.width,oh=cv.height,pr=renderer.getPixelRatio(),asp=camera.aspect;
  renderer.setPixelRatio(1);renderer.setSize(W,Hh,false);camera.aspect=W/Hh;camera.updateProjectionMatrix();controls.update();renderer.render(scene,camera);const url=cv.toDataURL(type||'image/png',0.92);
  renderer.setPixelRatio(pr);renderer.setSize(ow/pr,oh/pr,false);camera.aspect=asp;camera.updateProjectionMatrix();renderer.render(scene,camera);return url;}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function dl(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);}
function saveImg(){if(!ok3d||!model||!model.ok){alert('Complète d’abord la forme et les versants.');return;}if(st.tab==='plan'){dl($('#plan').toDataURL('image/png'),'batiment-plan-'+stamp()+'.png');return;}dl(snapshot(1920,1080),'batiment-3d-'+stamp()+'.png');}
const pdfTxt=s=>String(s).replace(/→/g,'>').replace(/↔/g,'-').replace(/[—–]/g,'-').replace(/[’]/g,"'").replace(/…/g,'...').replace(/[✓≠]/g,'');
function planImage(){const was=st.tab,keep={s:pv.s,ox:pv.ox,oy:pv.oy,f:pv.fitted,m:pv.mouse};st.tab='plan';const cv=$('#plan'),vis=cv.style.visibility;cv.style.visibility='visible';pv.mouse=null;pv.exp=true;fitPlan();drawPlan();pv.exp=false;
  const r=cv.getBoundingClientRect(),u=cv.toDataURL('image/jpeg',0.92);pv.s=keep.s;pv.ox=keep.ox;pv.oy=keep.oy;pv.fitted=keep.f;pv.mouse=keep.m;st.tab=was;cv.style.visibility=vis;if(was==='plan')drawPlan();else $('#banner').style.display='none';return {u,w:r.width,h:r.height};}
function savePdf(){if(!ok3d||!model||!model.ok){alert('Complète d’abord la forme et les versants.');return;}if(!window.jspdf){alert('Le PDF n’a pas pu se charger. Vérifie la connexion internet.');return;}
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});const R=recap();
  const img=snapshot(1800,1100,'image/jpeg');doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(15,61,46);doc.text('Bâtiment 3D',10,13);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90,100,95);doc.text(new Date().toLocaleDateString('fr-FR'),287,13,{align:'right'});
  doc.addImage(img,'JPEG',10,18,180,110);doc.setDrawColor(200,210,204);doc.rect(10,18,180,110);
  const cols=[{x:197,y0:22,y1:128,w:90},{x:10,y0:138,y1:202,w:88},{x:104,y0:138,y1:202,w:88},{x:198,y0:138,y1:202,w:88}];
  let ci=0,y=cols[0].y0;const nextCol=()=>{ci++;if(ci>=cols.length){doc.addPage();cols.length=0;[10,80,150,220].forEach(x=>cols.push({x,y0:15,y1:202,w:66}));ci=0;}y=cols[ci].y0;};
  const head=t=>{if(y+16>cols[ci].y1)nextCol();doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(15,61,46);doc.text(pdfTxt(t),cols[ci].x,y);y+=5.5;};
  const line=(a,b)=>{if(y+4.5>cols[ci].y1)nextCol();const c=cols[ci];doc.setFontSize(8.4);doc.setFont('helvetica','normal');doc.setTextColor(30,40,36);const left=doc.splitTextToSize(pdfTxt(a),b?c.w*0.52:c.w);doc.text(left[0],c.x,y);if(b){doc.setFont('helvetica','bold');doc.text(pdfTxt(b),c.x+c.w,y,{align:'right'});}y+=4.3;};
  head('Bâtiment');R.dims.forEach(([a,b])=>line(a,b));
  R.vers.forEach((rows,i)=>{if(i===0&&ci===0)nextCol();else y+=3;head(rows[0][0]+' (le long de la pente)');rows.slice(1).forEach(([a,b])=>line(a,b));});
  y+=3;head('Travées');R.trav.slice(1).forEach(([a,b])=>line(a,b));
  if(R.fac.length){y+=3;head('Façades');R.fac.forEach(([a,b])=>line(a,b));}
  if(R.loc.length){y+=3;head('Local technique et câble');R.loc.forEach(([a,b])=>line(a,b));}
  if(model.warns.length){y+=3;head('À vérifier');model.warns.forEach(w=>doc.splitTextToSize(pdfTxt(w),cols[ci].w).forEach(l=>line(l,'')));}
  const pl=planImage();doc.addPage();doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(15,61,46);doc.text('Plan vu de dessus',10,13);const k=Math.min(277/pl.w,182/pl.h);doc.addImage(pl.u,'JPEG',10,18,pl.w*k,pl.h*k);
  doc.save('batiment-3d-'+stamp()+'.pdf');}

// ================================================================ onglets et événements
function setTab(t){st.tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));$('#v3d').style.visibility=t==='3d'?'visible':'hidden';$('#plan').style.visibility=t==='plan'?'visible':'hidden';
  ['#l1','#l2','#bFit'].forEach(s=>$(s).style.display=t==='3d'?'':'none');planTools();resize();if(t==='plan'){if(!pv.fitted)fitPlan();drawPlan();}else $('#banner').style.display='none';}
let tm=0;const later=()=>{clearTimeout(tm);tm=setTimeout(()=>rebuild(false),160);};
document.addEventListener('input',e=>{const el=e.target;if(el.id==='lenEdit')return;
  if(el.dataset.k){setK(el.dataset.k,el.value);if(el.classList.contains('num'))el.classList.toggle('bad',!isFinite(num(el.value)));if(el.tagName==='SELECT'){renderSide();rebuild(false);}else later();}
  else if(el.dataset.l){getK(el.dataset.l)[+el.dataset.i]=el.value;el.classList.toggle('bad',!isFinite(num(el.value)));later();}
  else if(el.dataset.fl!=null){facGet(+el.dataset.fl,+el.dataset.p).l=el.value;later();}else if(el.dataset.fh!=null){facGet(+el.dataset.fh,+el.dataset.p).h=el.value;later();}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.kb){setK(el.dataset.kb,el.checked);renderSide();rebuild(true);}
  else if(el.dataset.fs!=null){facGet(+el.dataset.fs,+el.dataset.p).s=el.value;renderSide();rebuild(false);}
  else if(el.dataset.side!=null){setSideLen(+el.dataset.side,num(el.value));}
  else if(el.dataset.l&&el.dataset.l.startsWith('trav')){renderSide();rebuild(true);}
  else if(el.dataset.k&&el.tagName!=='SELECT'&&/^(mono|bi|irr)\./.test(el.dataset.k)){renderSide();rebuild(true);if(st.tab==='plan')fitPlan();}
  else if(el.id==='oCotes'||el.id==='oTransp')rebuild(false);});
document.addEventListener('click',e=>{const b=e.target.closest('button,h2[data-open]');if(!b)return;const d=b.dataset;
  if(d.tab){setTab(d.tab);return;}
  if(d.open){st.step=+d.open;renderSide();if(st.step===2&&st.type==='irr')setTab('plan');return;}
  if(d.t){st.type=d.t;pv.fitted=false;renderSide();rebuild(true);if(st.type==='irr')setTab('plan');else if(st.tab==='plan')fitPlan();return;}
  if(d.f){st.fait=d.f;renderSide();rebuild(false);return;}
  if(d.padd){const v=getK(d.padd);v.pans.push(v.pans.length?v.pans[v.pans.length-1]:'1,50');renderSide();rebuild(false);return;}
  if(d.pdel){const v=getK(d.pdel);if(v.pans.length)v.pans.pop();if(Number(v.cass)>v.pans.length)v.cass='';renderSide();rebuild(false);return;}
  if(d.tadd){const a=st.trav[st.type];a.push(a[a.length-1]||'6');renderSide();rebuild(true);return;}
  if(d.tdel){const a=st.trav[st.type];if(a.length>1)a.pop();renderSide();rebuild(true);return;}
  if(d.all){const v=document.querySelector(`[data-allv="${d.all}"]`).value;if(!isFinite(num(v)))return;const a=getK(d.all);for(let i=d.all.endsWith('.pans')?1:0;i<a.length;i++)a[i]=v;renderSide();rebuild(d.all.startsWith('trav'));return;}
  if(d.fall!=null){const S=model&&model.sides&&model.sides.find(s=>s.i===+d.fall);if(S)S.pieces.forEach((pc,k)=>facGet(S.i,k).s=d.v);renderSide();rebuild(false);return;}
  if(b.id==='bFit'){if(ok3d&&grp)fitView();return;}
  if(b.id==='pFit'){fitPlan();return;}
  if(b.id==='pNew'){pushUndo();st.irr.pts=[];st.irr.ridge=[];st.irr.mode='draw';pv.buf='';irrChanged();fitPlan();return;}
  if(b.id==='pRidge'){if(st.irr.mode==='draw'||st.irr.pts.length<3)return;pushUndo();st.irr.ridge=[];st.irr.mode='ridge';irrChanged();return;}
  if(b.id==='pUndo'){undo();return;}
  if(b.id==='bImg')saveImg();else if(b.id==='bPdf')savePdf();});
window.addEventListener('resize',()=>{if(st.tab==='plan')drawPlan();});

renderSide();init3d();setupPlan();setTab(st.tab);rebuild(true);
</script>
